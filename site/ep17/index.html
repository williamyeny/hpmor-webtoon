<img src="010.webp" width="1000" height="950" alt="Crabbe and Goyle, looming in perfect unison. / Harry: …and what's worse, they do know each other, and they've been practising…" loading="lazy" decoding="async">

<img src="020.webp" width="1000" height="950" alt="Harry: That the Sorting Hat put me in the House of &quot;Slytherin! Just kidding! Ravenclaw!&quot;, and I've been acting accordingly." loading="lazy" decoding="async">

<img src="024.webp" width="1000" height="775" alt="Harry: Oh, this is going to be so much fun to juggle. I can already tell." loading="lazy" decoding="async">
<img src="025.webp" width="1000" height="1250" alt="The tiers, now full: all four Houses. On every desk, a white screen showing Quirrell's face. / At 2:35, Professor Quirrell gave a sudden jerk in his chair and sat up straight. And his face appeared on all the flat, white rectangles propped up on the students' desks." loading="lazy" decoding="async">
<img src="026.webp" width="1000" height="975" alt="It was so much like Muggle television. There was something both nostalgic and sad about it. So much like a piece of home, and yet it wasn't, really." loading="lazy" decoding="async">
<img src="027.webp" width="1000" height="1438" alt="Over the heads of the class: Quirrell on his dais, wide awake now. / Quirrell: Good afternoon, my young apprentices. Welcome to your first lesson in Battle Magic, as the founders of Hogwarts would have put it. Or, as it happens to be called in the late twentieth century, Defence Against the Dark Arts." loading="lazy" decoding="async">
<img src="028.webp" width="1000" height="900" alt="There was a certain amount of frantic scrabbling for parchment." loading="lazy" decoding="async">
<img src="029.webp" width="1000" height="1125" alt="Quirrell: No. Don't bother writing down what this subject was once called. No such pointless question will count toward your marks in any of my lessons. That is a promise." loading="lazy" decoding="async">
<img src="030.webp" width="1000" height="1250" alt="Quirrell strides across the white marble stage. / Quirrell: Those of you who have wasted time by reading your useless first-year Defence textbooks… / Someone made a choking sound. Harry wondered if it was Hermione." loading="lazy" decoding="async">
<img src="031.webp" width="1000" height="1750" alt="A dragon's silhouette, wings raised, breathing a jet of fire. / Quirrell: The Hungarian Horntail is taller than a dozen men! It breathes fire so quickly and so accurately that it can melt a Snitch in mid-flight! / Quirrell: One Killing Curse will bring it down!" loading="lazy" decoding="async">
<img src="032.webp" width="1000" height="1875" alt="A mountain troll's silhouette, club in hand, small yellow eyes. / Quirrell: The Mountain Troll is more dangerous than the Hungarian Horntail! It is strong enough to bite through steel! Its hide withstands Stunning Hexes and Cutting Charms! Its sense of smell can tell from afar whether its prey is part of a pack, or alone and vulnerable!" loading="lazy" decoding="async">
<img src="033.webp" width="1000" height="1563" alt="The troll's torn-off arm already growing back, glowing. / Quirrell: It is always Transfiguring itself into its own body. Rip off its arm, and it will grow another within seconds! Fire and acid will confuse its regeneration, for an hour or two!" loading="lazy" decoding="async">
<img src="034.webp" width="1000" height="1250" alt="Quirrell: The mountain troll is the third most perfect killing machine in all Nature! One Killing Curse will bring it down." loading="lazy" decoding="async">
<img src="035.webp" width="1000" height="1125" alt="Quirrell holds up the first-year textbook between two fingers, like something unpleasant. / Quirrell: Your sad excuse for a textbook will suggest you expose the troll to sunlight. You do not encounter mountain trolls in open daylight!" loading="lazy" decoding="async">
<img src="036.webp" width="1000" height="1313" alt="Quirrell: If, as an adult wizard, you find yourself incapable of the Killing Curse, you can simply Apparate away. Likewise if you face the second most perfect killing machine: a Dementor. You just Apparate away!" loading="lazy" decoding="async">
<img src="037.webp" width="1000" height="1250" alt="Quirrell's voice goes low and hard. The air around him feels subtly wrong. / Quirrell: Unless, of course, you are under the influence of an anti-Apparition jinx. No. There is exactly one monster which can threaten you once you are fully grown. The single most dangerous monster in all the world." loading="lazy" decoding="async">

<img src="039.webp" width="1000" height="1650" alt="Quirrell jabs a finger at the class. / Quirrell: There is no defence without offence! There is no defence without fighting! / Quirrell: This reality is deemed too harsh for eleven-year-olds by the fat, overpaid, Auror-guarded politicians who mandated your curriculum." loading="lazy" decoding="async">
<img src="040.webp" width="1000" height="1375" alt="Quirrell, arms flung wide, triumphant. / Quirrell: To the abyss with those fools! Welcome to your first year of Battle Magic!" loading="lazy" decoding="async">

<img src="042.webp" width="1000" height="1125" alt="Quirrell perches on the front of his desk, relaxed. / Quirrell: Now to practicalities. I have combined all my first-year classes into one, which allows me to offer you twice as much classroom time as Doubles sessions…" loading="lazy" decoding="async">

<img src="045.webp" width="1000" height="1375" alt="Quirrell: For those who so choose, I have arranged some after-school activities. Do you want to show the world your own abilities, instead of watching fourteen other people play Quidditch? More than seven people can fight in an army." loading="lazy" decoding="async">
<img src="046.webp" width="1000" height="1375" alt="Quirrell: And for Christmas, I will grant someone a wish. Any school-related feat within my power, my influence, or above all, my ingenuity. Yes, I was in Slytherin, and I am offering to formulate a cunning plot on your behalf. The wish goes to whoever has earned the most Quirrell points." loading="lazy" decoding="async">

<img src="085.webp" width="1000" height="700" alt="The Slytherins laugh, with Harry, not at him." loading="lazy" decoding="async">

<img src="088.webp" width="1000" height="1025" alt="A sense of vertigo. / Harry: What? Wait, that couldn't be true… surely there had to be a counterexample…" loading="lazy" decoding="async">
