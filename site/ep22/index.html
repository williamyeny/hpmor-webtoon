<img src="004.webp" width="1000" height="1263" alt="Harry: You ask, what is our aim? I can answer in one word. It is victory. Victory at all costs. Victory in spite of all terrors. Victory, however long and hard the road may be, for without victory there is no… / Draco: Talk about SNAPE. What did you do?" loading="lazy" decoding="async">
<img src="005.webp" width="1000" height="1250" alt="Harry: You saw it. Everyone saw it. I snapped my fingers. / Draco: Harry! Stop teasing me! / Harry: So he'd been promoted to &quot;Harry&quot; now. Interesting." loading="lazy" decoding="async">
<img src="006.webp" width="1000" height="2090" alt="Harry: Draco, I'm going to be one hundred percent honest, and say I'm not entirely sure they wouldn't just report what I said to Lucius. / Draco: Father wouldn't do that! They're mine! / Harry: I'm sorry, Draco. I'm just not sure I can believe everything you believe about your father. Imagine it was your secret, and me telling you my father wouldn't do that." loading="lazy" decoding="async">
<img src="007.webp" width="1000" height="1250" alt="Draco: You're right. I'm sorry, Harry. It was wrong of me to ask it of you. Go! / The minions left, looking very unhappy." loading="lazy" decoding="async">
<img src="008.webp" width="1000" height="1625" alt="Harry: Trade. I tell you a fact that isn't on the grapevine and does not go on the grapevine, and in particular does not go to your father. And you tell me what Slytherin thinks. / Harry: What I said was true. I did discover one of Severus's secrets, and I did do some blackmail. But Severus wasn't the only person involved." loading="lazy" decoding="async">
<img src="009.webp" width="1000" height="1200" alt="Draco: I KNEW IT! / Harry's stomach sank. He had apparently said something very significant, and he didn't know why." loading="lazy" decoding="async">
<img src="010.webp" width="1000" height="1875" alt="Draco: So here's what the reaction was like in Slytherin. First, all the idiots were like, &quot;We hate Harry Potter! Let's go beat him up!&quot; Then the second wave of idiots said, &quot;Looks like Harry Potter was just another do-gooder after all.&quot; / Draco: And then the really smart people had a little discussion. If you could break Snape's hold over Dumbledore, you'd just do it. So Snape's hold was some secret of Dumbledore's, and you've got the secret! Father's been trying to get Snape to tell him for years!" loading="lazy" decoding="async">
<img src="011.webp" width="1000" height="1213" alt="(In a different, more formal cadence. His father's.) / Draco: I'll get an owl tonight. My beloved son: as you have already realised, Harry Potter's importance has now become greater and more urgent. If you see any possible avenue of friendship or point of pressure, pursue it. The full resources of Malfoy are at your disposal." loading="lazy" decoding="async">
<img src="012.webp" width="1000" height="1900" alt="Draco: Harry. Has it occurred to you that if you know something Dumbledore doesn't want known, Dumbledore might simply have you killed? It would turn the Boy-Who-Lived into a valuable martyr, too. / Draco: You've obviously got incredible talent, but you've got no training and no mentors and you do stupid things sometimes and you really need an advisor who knows how to do this or you're going to get hurt!" loading="lazy" decoding="async">
<img src="013.webp" width="1000" height="2140" alt="Harry: Ah. An advisor like Lucius? / Draco: Like me! I'll keep your secrets from Father, from everyone! I'll just help you figure out whatever you want to do! / Draco: You shouldn't trust me. It's too soon. See? I'll give you good advice, even if it hurts me. But we should maybe hurry up and become closer friends." loading="lazy" decoding="async">
<img src="014.webp" width="1000" height="1843" alt="Draco: Another bit of advice: if you're courting Slytherin, which I think you are, do something that signals friendship. Soon. Push your mudblood rival Granger into a wall or something, everyone in Slytherin will know what that means… / Harry: That is not how it works in Ravenclaw, Draco! If you have to push someone into a wall, it means your brain is too weak to beat them the right way!" loading="lazy" decoding="async">
<img src="015.webp" width="1000" height="1438" alt="Quirrell: Today I had planned to teach you your first defensive spell. But I have changed today's lesson plan in the light of recent events. / Quirrell: Draco, of the Noble and Most Ancient House of Malfoy. Is it your ambition to become the next Dark Lord?" loading="lazy" decoding="async">
<img src="016.webp" width="1000" height="1325" alt="Draco: That's an odd question, Professor. I mean, who'd be dumb enough to admit it? / Quirrell: Indeed. So it would not surprise me in the slightest if there were a student or two in my classes who harboured ambitions of being the next Dark Lord. After all, I wanted to be the next Dark Lord, when I was a young Slytherin." loading="lazy" decoding="async">
<img src="017.webp" width="1000" height="1563" alt="Quirrell: When I was thirteen, I read the lives and fates of past Dark Lords, and made a list of all the mistakes that I would never make when I was a Dark Lord… / Harry giggled before he could stop himself. / Quirrell: Yes, Mr Potter, very amusing. So, Mr Potter: can you guess the very first item on that list?" loading="lazy" decoding="async">
<img src="018.webp" width="1000" height="1388" alt="Harry: Um… never use a complicated way of dealing with an enemy when you can just Abracadabra them? / Quirrell: The term, Mr Potter, is Avada Kedavra, and no. Guess again. / Harry: Ah… never brag to anyone about your evil master plan?" loading="lazy" decoding="async">
<img src="019.webp" width="1000" height="1613" alt="Quirrell: Ah, now that was number two. My, Mr Potter, have we been reading the same books? / Quirrell: But no. The first item was: I will not go around provoking strong, vicious enemies. Now if, Mr Potter, by some chance you harbour an ambition similar to mine as a young Slytherin, I hope it is not your ambition to become a stupid Dark Lord." loading="lazy" decoding="async">
<img src="020.webp" width="1000" height="1713" alt="Harry: Professor Quirrell, I am a Ravenclaw, and it is not my ambition to be stupid, period. I know what I did today was dumb. But it wasn't Dark! I was not the one who threw the first punch in that fight! / Quirrell: You, Mr Potter, are an idiot. But then so was I at your age. Thus I anticipated your answer, and altered today's lesson plan accordingly. Mr Gregory Goyle, if you would come forward, please?" loading="lazy" decoding="async">
<img src="021.webp" width="1000" height="1865" alt="Quirrell: Most wizards do not bother much with what a Muggle would call martial arts. Is not a wand stronger than a fist? This attitude is stupid. Wands are held in fists. Mr Goyle, I will ask you to attack me. / Goyle: Professor Quirrell, can I ask what level… / Quirrell: Sixth dan. You will not be hurt, and neither will I. And if you see an opening, please take it." loading="lazy" decoding="async">
<img src="022.webp" width="1000" height="1613" alt="The boy blurred forward, fists flying. The Professor blocked every blow. It was all happening too fast to follow, and then Goyle was on his back with his legs pushing, and Quirrell was actually flying through the air…" loading="lazy" decoding="async">
<img src="023.webp" width="1000" height="1150" alt="Quirrell: Stop! You win! / Mr Goyle pulled up so sharply he staggered. His face showed utter shock. There was a silence in the classroom, a silence born of total confusion." loading="lazy" decoding="async">
<img src="024.webp" width="1000" height="1715" alt="Quirrell: Mr Goyle, what vitally important technique did I just demonstrate? / Goyle: How to fall correctly when someone throws you? / Quirrell: That too. But the vitally important technique which I demonstrated was how to lose. You do not teach students to throw until you have taught them to fall. And I must not teach you to fight, if you do not understand how to lose." loading="lazy" decoding="async">
<img src="025.webp" width="1000" height="250" alt="Quirrell's story" loading="lazy" decoding="async">
<img src="026.webp" width="1000" height="1250" alt="Quirrell: I learned how to lose in a dojo in Asia, which, as any Muggle knows, is where all the good martial artists live. Its Master was that style's greatest living teacher. He had no idea that magic existed, of course." loading="lazy" decoding="async">
<img src="027.webp" width="1000" height="2238" alt="Quirrell: During one of my first fights, after I had been beaten in a particularly humiliating fashion, I lost control and attacked my sparring partner. The Master told me there was a flaw in my temperament. And then he said that I would learn how to lose. / Quirrell: One by one, the students approached me. I was not to defend myself. They pushed me to the ground. And to each one, I had to say, &quot;I lose.&quot;" loading="lazy" decoding="async">
<img src="028.webp" width="1000" height="1438" alt="Quirrell: I was a prodigy of Battle Magic even then. With wandless magic alone, I could have killed everyone in that dojo. I did not. I learned to lose. When I left, the Master told me he hoped I understood why it had been necessary. I told him it was one of the most valuable lessons I had ever learned. Which was, and is, true." loading="lazy" decoding="async">
<img src="029.webp" width="1000" height="2193" alt="Quirrell: Not long afterwards, another would-be student came to that hidden place. He-Who-Must-Not-Be-Named. He came openly, glowing red eyes and all. And he demanded, not asked but demanded, to be taught. / Quirrell: The Master refused. The Dark Lord asked why he could not be a student. The Master told him: he had no patience." loading="lazy" decoding="async">
<img src="030.webp" width="1000" height="1950" alt="Quirrell: You can guess what happened next. The students tried to rush him, and fell, stunned where they stood. And then, one by one, the Dark Lord hurt the Master's students until they went mad, and then he killed them, while the Master was forced to watch. And then the Master. / Quirrell: I learned this from the single surviving student, whom the Dark Lord left alive to tell the tale. He had been a friend of mine." loading="lazy" decoding="async">
<img src="031.webp" width="1000" height="1350" alt="Professor Quirrell turned away. When he turned back a moment later, he once again seemed calm and composed. / Quirrell: Dark Wizards cannot keep their tempers. It is a nearly universal flaw of the species. Understand that the Dark Lord did not win that day. His goal was to learn martial arts, and he left without a single lesson." loading="lazy" decoding="async">
<img src="032.webp" width="1000" height="1000" alt="Quirrell: Harry Potter. What precisely did you do wrong today? / Harry: I lost my temper." loading="lazy" decoding="async">
<img src="033.webp" width="1000" height="1950" alt="Quirrell: That is not precise. Many animals have dominance contests. They rush at each other with horns, trying to knock each other down, not gore each other. They fight with their claws sheathed. Surely with claws out they would stand a better chance? But then their enemy might unsheathe theirs, and both might be badly hurt. / Stags lock horns to push, not to kill. Cats fight with their claws in." loading="lazy" decoding="async">
<img src="034.webp" width="1000" height="1768" alt="Quirrell: What you demonstrated today, Mr Potter, is that you do not know how to lose a dominance contest. When a Hogwarts professor challenged you, you did not back down. When it looked like you might lose, you unsheathed your claws, heedless of the danger. / Quirrell: You escalated, and then you escalated again. It started with a slap, and soon you were talking about leaving Hogwarts. The fact that you escalated even further in some unknown direction, and somehow won at the end, does not change the fact that you are an idiot." loading="lazy" decoding="async">
<img src="035.webp" width="1000" height="1650" alt="That had been precise. Frighteningly precise. When someone's model of you was that good, you had to wonder whether they were right about other things too. Like your intent to kill. / Quirrell: The next time you choose to escalate rather than lose, you may lose all the stakes on the table. I cannot guess what they were today. I can guess that they were far, far too high for ten House points." loading="lazy" decoding="async">
<img src="036.webp" width="1000" height="1500" alt="Quirrell: You will protest that you were trying to help all of Hogwarts. That is a lie. If you had been… / Harry: I would have taken the slap, waited, and picked the best possible time to make my move. But that would have meant losing. Letting him be dominant over me. It was what the Dark Lord couldn't do, with the Master he wanted to learn from." loading="lazy" decoding="async">
<img src="037.webp" width="1000" height="1775" alt="Quirrell: I see that you have understood perfectly. And so, Mr Potter, today you are going to learn how to lose. / Harry: Professor Quirrell… can we do this some other time? / Quirrell: No. You are five days into your Hogwarts education, and already this has happened. Today is Friday. Our next class is Wednesday. Saturday, Sunday, Monday, Tuesday, Wednesday… No, we do not have time to wait." loading="lazy" decoding="async">
<img src="038.webp" width="1000" height="1500" alt="Quirrell: Unfortunately, I am told that your fingers are already powerful weapons. Do not snap them at any time during this lesson. / Quirrell: The point is not to avoid getting angry. Anger is natural. You need to learn how to lose even when you are angry. Or at least pretend to lose, so that you can plan your vengeance. As I did with Mr Goyle today…" loading="lazy" decoding="async">
<img src="039.webp" width="1000" height="1125" alt="Goyle: I'm not better than you! I know you didn't really lose! Please don't plan any vengeances!" loading="lazy" decoding="async">
<img src="040.webp" width="1000" height="1250" alt="Harry: Professor Quirrell, do you really believe that if I don't do this, I might hurt someone? / Quirrell: Yes. / Harry: Then I'll do it." loading="lazy" decoding="async">
<img src="041.webp" width="1000" height="1163" alt="Quirrell: So, with the full approval of your teacher, and in such a fashion that Snape cannot be blamed: do any of you wish to show your dominance over the Boy-Who-Lived? / Five hands went up." loading="lazy" decoding="async">
<img src="042.webp" width="1000" height="1848" alt="Quirrell: Everyone with your hand raised, you are an absolute idiot. What part of pretending to lose did you not understand? / Quirrell: If Harry Potter does become the next Dark Lord, he will hunt you down and kill you after he graduates. / The five hands dropped abruptly." loading="lazy" decoding="async">
<img src="043.webp" width="1000" height="1488" alt="Harry: I won't. I swear never to take vengeance upon those who help me learn to lose. Professor Quirrell, would you please stop that? / Quirrell: I am sorry, Mr Potter. Would it be acceptable if I awarded you a Quirrell point in apology? / Harry: Make it two. And after I graduate, I'm going to hunt you down and tickle you." loading="lazy" decoding="async">
<img src="044.webp" width="1000" height="1825" alt="Draco: Professor. It is also not my ambition to become a stupid Dark Lord. / There was a shocked silence in the classroom. / Draco: When it comes to talking, maybe my father taught me. Not when it comes to being shoved around. I want to be fully as strong as you, Professor Quirrell." loading="lazy" decoding="async">
<img src="045.webp" width="1000" height="538" alt="Harry: You don't have to do this! If Draco had intended to impress him, it was working perfectly." loading="lazy" decoding="async">
<img src="046.webp" width="1000" height="1593" alt="Quirrell: It is my professional opinion that you are already very strong, Mr Malfoy. Draco Malfoy will be one of the generals of your year's armies, should he deign to engage in that activity. / Quirrell: Does anyone else wish to become strong? / No-one spoke." loading="lazy" decoding="async">
<img src="047.webp" width="1000" height="1388" alt="Harry stood on a soft blue mat, such as might be found in a Muggle dojo. His wand lay on Professor Quirrell's desk, because otherwise he might try to jam it through someone's eye socket. His pouch lay there too. / He had pleaded with Professor Quirrell to Transfigure boxing gloves onto his hands. Professor Quirrell had given him a look of silent understanding, and refused." loading="lazy" decoding="async">
<img src="048.webp" width="1000" height="650" alt="Harry: I will not go for their eyes, I will not go for their eyes, I will not go for their eyes. It would be the end of my life in Hogwarts." loading="lazy" decoding="async">
<img src="049.webp" width="1000" height="1563" alt="Harry, small, in the middle of a ring of big grinning Slytherin teenagers. / Professor Quirrell returned, escorting thirteen older Slytherins. Harry recognised one of them as the one he'd hit with a pie. Two others from that confrontation were there too. The one who'd said to stop, that they really shouldn't do this, was missing. / Quirrell: Potter is not to be really hurt. Any and all accidents will be treated as deliberate. Then please feel free to take the Boy-Who-Lived down a few pegs." loading="lazy" decoding="async">
<img src="050.webp" width="1000" height="1325" alt="Quirrell: Potter, meet Mr Peregrine Derrick. He is better than you, and he is about to show you that. / A teenage boy fully half a metre taller than Harry, with defined muscles, facial hair, and a grin of terrible anticipation." loading="lazy" decoding="async">
<img src="051.webp" width="1000" height="1550" alt="Quirrell: Ask him not to hurt you. Perhaps if he sees that you're pathetic enough, he'll decide you're boring and go away. / Harry: Please, don't, hurt, me… / Quirrell: That didn't sound very sincere. How in Merlin's name did you manage to make that sound like an insult, Potter?" loading="lazy" decoding="async">
<img src="052.webp" width="1000" height="1525" alt="Derrick: You bumped into me, Potter. Apologise. / Harry: I'm sorry! / Derrick: You don't sound sorry." loading="lazy" decoding="async">
<img src="053.webp" width="1000" height="1125" alt="Harry, knocked to his hands and knees on the blue mat. / Derrick pushed him, hard, and Harry fell to the mat on his hands and knees. / Derrick: This is fun." loading="lazy" decoding="async">
<img src="054.webp" width="1000" height="1363" alt="Harry: All he had to do was say it was over. And report the whole thing to the Headmaster. That would be the end of this Defence Professor… / (An image of Professor McGonagall's face flashed before his eyes. She didn't look angry. Just sad.)" loading="lazy" decoding="async">
<img src="055.webp" width="1000" height="1663" alt="Quirrell: Now tell him that he's better than you, Potter. / Harry: You're, better, than, me. / Harry started to raise himself, and Derrick put a foot on his chest and shoved him back down." loading="lazy" decoding="async">
<img src="056.webp" width="1000" height="1375" alt="Ice-cold eyes. Crystal clarity. / Harry: The world was becoming transparent as crystal. Lines of action and their consequences stretched out in utter clarity. The fool wouldn't be expecting him to strike back. A quick hit would stun him long enough for…" loading="lazy" decoding="async">
<img src="057.webp" width="1000" height="1438" alt="Quirrell: Try again. / And with a sudden sharp motion Harry rolled, and sprang to his feet, and whirled on where stood his real enemy. The Defence Professor." loading="lazy" decoding="async">
<img src="058.webp" width="1000" height="900" alt="Quirrell, quiet, looking straight at him. The same words the Master said. / Quirrell: You have no patience." loading="lazy" decoding="async">
<img src="059.webp" width="1000" height="875" alt="Harry faltered. His mind, well-honed in pessimism, drew him a picture of an old man, and what had been done to him." loading="lazy" decoding="async">
<img src="060.webp" width="1000" height="1350" alt="Derrick sits on Harry. / A moment later, Derrick pushed him to the mat again, and then sat down on him, and the breath went whooshing out of him. / Harry: Stop! Please stop!" loading="lazy" decoding="async">
<img src="061.webp" width="1000" height="875" alt="Quirrell: Better. That even sounded sincere. / It had been. That was the horrible thing, the sickening thing. It had been sincere." loading="lazy" decoding="async">
<img src="062.webp" width="1000" height="1125" alt="Quirrell: Lose. / Harry: I, lose." loading="lazy" decoding="async">
<img src="063.webp" width="1000" height="1663" alt="Hands shoved Harry, sending him stumbling across the circle to another set of hands that shoved him again. He had long since passed the point of trying not to cry. He was just trying not to fall down. / Derrick: I like it. Lose some more. / Derrick: What are you, Potter? / Harry: A, l-loser, I lose, I give up, you win, you're b-better, than me, please stop…" loading="lazy" decoding="async">
<img src="064.webp" width="1000" height="1075" alt="Harry tripped over a foot, and went crashing to the ground, hands not quite able to catch himself." loading="lazy" decoding="async">
<img src="065.webp" width="1000" height="950" alt="A voice sharp enough to cut iron. / Quirrell: ENOUGH! Step away from Mr Potter!" loading="lazy" decoding="async">
<img src="066.webp" width="1000" height="1850" alt="Professor Quirrell talked. There were gasps from the older Slytherins. Then Draco's voice, in his father's cadence: could have put Slytherin House in jeopardy… total lack of awareness, never mind cunning… dull thugs, useful for nothing but lackeys… / And something in Harry's hindbrain, despite everything he knew, designated Draco as an ally." loading="lazy" decoding="async">
<img src="067.webp" width="1000" height="1438" alt="Harry: Wait. There's something, I want, to say, to them… / Quirrell: Stop. If that's what I think it is, please wait until after they're gone. They'll hear about it later. We all have our lessons to learn, Mr Potter. You. Go." loading="lazy" decoding="async">
<img src="068.webp" width="1000" height="1125" alt="Harry, swaying, careful not to look at his classmates. / Harry: No-one's to take any revenge on them. That's a request to anyone who considers themselves my friend. I had my lesson to learn, they helped me learn it, they had their lesson to learn too, and it's over. If you tell this story, make sure you tell that part too." loading="lazy" decoding="async">
<img src="069.webp" width="1000" height="1838" alt="Quirrell: You lost. / His voice was gentle, for the first time. It sounded strange coming from him, like his voice shouldn't even be able to do that. / Quirrell: And are you yet alive? / Harry managed to nod." loading="lazy" decoding="async">
<img src="070.webp" width="1000" height="2000" alt="Quirrell: Not all losing is like this. There are compromises, and negotiated surrenders. There is a whole art to manipulating others by letting them be dominant over you. But first, losing must be thinkable. Will you remember how you lost? / Harry: Yes. / Quirrell: Will you be able to lose? / Harry: I… think so…" loading="lazy" decoding="async">
<img src="071.webp" width="1000" height="1500" alt="Quirrell: I think so too. / Quirrell: Congratulations, Harry Potter. You win." loading="lazy" decoding="async">
<img src="072.webp" width="1000" height="1743" alt="There was no single source, no first mover. The applause started all at once, like a massive thunderclap. / From Ravenclaw and Gryffindor and Hufflepuff and even Slytherin, probably because Draco Malfoy was applauding too. Half of Gryffindor was standing on their desks." loading="lazy" decoding="async">
<img src="073.webp" width="1000" height="1025" alt="Harry risked a glance at his classmates. He saw their faces showing not pity, but awe. So he stood there, swaying, letting their respect wash over him, feeling stronger. Maybe even a little healed." loading="lazy" decoding="async">
<img src="074.webp" width="1000" height="1688" alt="Quirrell: Surprised, Mr Potter? You have just found out that the real world does not always work like your worst nightmares. They saw you confront your fear, and keep confronting it, even though you could have walked away at any time. Did you think less of me, when I told you I had been pushed to the ground? / Quirrell: Your extraordinary achievement deserves an extraordinary reward. Remember that there are Slytherins, and then there are Slytherins. Fifty-one points to Ravenclaw." loading="lazy" decoding="async">
<img src="075.webp" width="1000" height="875" alt="Pandemonium broke out among the Ravenclaws: howling, whistling, cheering." loading="lazy" decoding="async">
<img src="076.webp" width="1000" height="1125" alt="(And in the same moment, Harry felt something wrong about that. Professor McGonagall had been right. There should have been consequences, a cost, a price. You couldn't just put everything back the way it was.)" loading="lazy" decoding="async">
<img src="077.webp" width="1000" height="1525" alt="Harry: Professor Quirrell, you are everything a member of your House should be. I think you must be just what Salazar Slytherin had in mind when he helped found Hogwarts. I thank you and your House. And I think this calls for three cheers for Slytherin. Huzzah! Huzzah! HUZZAH! / Draco's hand moved in a small, quick thumbs-up." loading="lazy" decoding="async">
<img src="078.webp" width="1000" height="1000" alt="Most of the Slytherins looked shocked. A few stared at Professor Quirrell in wonder. And Blaise Zabini was looking at Harry with a calculating, intrigued expression." loading="lazy" decoding="async">
<img src="079.webp" width="1000" height="1750" alt="Quirrell: Now, believe it or not, we still have half an hour, which is enough to introduce the Simple Shield. Mr Potter, of course, is going off to take a well-earned rest. / Harry: I can… / Quirrell: Idiot. Third door from the left, at the back of the stage. You will find a bed, some exceptionally tasty snacks, and some extremely light reading. You may not take your textbooks. Now go." loading="lazy" decoding="async">
<img src="080.webp" width="1000" height="875" alt="Harry walks toward the third door at the back of the stage. / Harry went." loading="lazy" decoding="async">
