<img src="025.webp" width="1000" height="650" alt="Harry asleep. The candle out." loading="lazy" decoding="async">

<img src="032.webp" width="1000" height="1125" alt="The anger drains out of him, leaving a wounded look. / Harry: No. This could only have been done by all twelve of the other boys. All of them would have seen him asleep. All of them had let him sleep through breakfast. / Harry: They'd liked him. He'd thought." loading="lazy" decoding="async">
<img src="033.webp" width="1000" height="1250" alt="A note pinned to his headboard, in pencil. / My fellow Ravenclaws,  It's been an extra long day. Please let me sleep in and don't worry about my missing breakfast. I haven't forgotten about my first class.  Harry Potter" loading="lazy" decoding="async">

<img src="039.webp" width="1000" height="1125" alt="On the back of the note, in perfectly regular writing: the instructions for The Game. / Instructions for The Game  you do not know the rules of the game  you do not know the stakes of the game  you do not know the objective of the game  you do not know who controls the game  you do not know how to end the game  You start with 100 points.  Begin." loading="lazy" decoding="async">

<img src="048.webp" width="1000" height="675" alt="Harry: And now I know that whoever controls the game is insane." loading="lazy" decoding="async">
