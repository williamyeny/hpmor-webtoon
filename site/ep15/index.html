<img src="001.webp" width="1000" height="413" alt="BOOK TWO · THE FIRST WEEK / CHAPTER FIFTEEN / The Time-Turner" decoding="async">
<img src="002.webp" width="1000" height="1125" alt="McGonagall's office. She sits on a backless stool behind a tidy desk, looking at Harry with slight apprehension. / Professor McGonagall's office was clean and well organised. A wall of cubbyholes, each with its scrolls, each meaning something to her and no-one else. A single parchment on the desk. Behind it, a door barred with several locks. / McGonagall: Mr Potter? What is this about?" decoding="async">
<img src="003.webp" width="1000" height="775" alt="Harry's mind went blank. The Game had sent him here. He'd been expecting her to have something in mind…" decoding="async">
<img src="004.webp" width="1000" height="950" alt="Thankfully, his panicking brain remembered that he did have something important to tell her. / Harry: Um… if there are any spells you can cast to make sure no-one's listening to us…" loading="lazy" decoding="async">
<img src="005.webp" width="1000" height="1125" alt="She stood, firmly closed the outer door, and began casting spells. / Harry: It was at this point that Harry realised he had a priceless opportunity to offer Professor McGonagall a Comed-Tea, and he told that part of himself to shut up." loading="lazy" decoding="async">
<img src="006.webp" width="1000" height="1025" alt="Her face is rather tight. / McGonagall: All right. No-one's listening. / Harry: Oh, right. She's expecting me to blackmail her about the prophecy." loading="lazy" decoding="async">
<img src="007.webp" width="1000" height="1500" alt="Harry: It's about the Incident with the Sorting Hat. I think there's an extra spell on it. Something the Hat itself doesn't know about, that triggers when it says Slytherin. / Harry: The moment it came off my head, I heard something like a hiss and like English at the same time. It said: Salutations from Slytherin to Slytherin. If you would seek my secrets, speak to my snake." loading="lazy" decoding="async">
<img src="008.webp" width="1000" height="950" alt="Professor McGonagall sat there with her mouth open, staring as though he'd grown another two heads." loading="lazy" decoding="async">
<img src="009.webp" width="1000" height="1250" alt="McGonagall: So… you decided to come to me right away, and tell me about it. / Harry: Well, yes, of course. As opposed to, say, trying to research it myself, or telling any of the other children. / There was no need to admit how long it had taken him to think of that." loading="lazy" decoding="async">
<img src="010.webp" width="1000" height="1075" alt="McGonagall: And if, perhaps, you were to discover the entrance to Salazar Slytherin's legendary Chamber of Secrets, an entrance that you and you alone could open…" loading="lazy" decoding="async">
<img src="011.webp" width="1000" height="1375" alt="Harry: I would close the entrance and report to you at once, so that a team of experienced magical archæologists could be assembled. They would go in very carefully, and I would go in afterwards, once they had photographs of how everything looked before people started tramping around their priceless historical site." loading="lazy" decoding="async">
<img src="012.webp" width="1000" height="825" alt="She stared at him like he'd just turned into a cat." loading="lazy" decoding="async">
<img src="013.webp" width="1000" height="1375" alt="Harry: It's obvious if you're not a Gryffindor. / McGonagall: I think that you far underestimate the rarity of common sense, Mr Potter. / Harry: A Hufflepuff would've said the same thing." loading="lazy" decoding="async">
<img src="014.webp" width="1000" height="1200" alt="McGonagall: That's true. / Harry: Sorting Hat offered me Hufflepuff. / McGonagall: Did it really?" loading="lazy" decoding="async">
<img src="015.webp" width="1000" height="1325" alt="McGonagall: Mr Potter. Five decades ago was the last time a student died within the walls of Hogwarts. / McGonagall: And I am now certain that five decades ago was the last time someone heard that message." loading="lazy" decoding="async">
<img src="016.webp" width="1000" height="1438" alt="Harry: Then I will be very sure to take no action whatsoever on this matter without consulting you. / Harry: And may I suggest you get the best people you can, and see if that extra spell can be taken off the Hat? And if not, add a Quietus that triggers as the Hat comes off a student's head. There. No more dead students." loading="lazy" decoding="async">
<img src="017.webp" width="1000" height="1025" alt="McGonagall: I cannot possibly award you enough points for this without giving the House Cup to Ravenclaw outright." loading="lazy" decoding="async">
<img src="018.webp" width="1000" height="1475" alt="Harry: Um. I'd rather not earn that many House points. / Harry: It would be too sad. Like when I was at Muggle school, and there was a group project, and I'd do the whole thing myself because the others would only slow me down. If I win the House Cup by myself, then I'm carrying Ravenclaw on my back. That's too sad." loading="lazy" decoding="async">
<img src="019.webp" width="1000" height="1438" alt="McGonagall: Suppose I only awarded you fifty points, then? / Harry: It's not fair to the other children, if I earn lots of points for grown-up things they can't be part of. How is Terry Boot supposed to earn fifty points for reporting a whisper from the Sorting Hat?" loading="lazy" decoding="async">
<img src="020.webp" width="1000" height="1125" alt="McGonagall: I see why the Sorting Hat offered you Hufflepuff. / She was eyeing him with a strange respect." loading="lazy" decoding="async">
<img src="021.webp" width="1000" height="950" alt="That made Harry choke up a bit. He'd honestly thought he wasn't worthy of Hufflepuff. That the Hat had just been trying to shove him anywhere but Ravenclaw, into a House whose virtues he didn't have…" loading="lazy" decoding="async">
<img src="022.webp" width="1000" height="875" alt="McGonagall: And if I tried to give you ten points…?" loading="lazy" decoding="async">
<img src="023.webp" width="1000" height="1438" alt="Harry: Are you going to explain where they came from, if anyone asks? There might be a lot of Slytherins, and I don't mean the children, who would be really really angry about that spell coming off the Hat. Absolute secrecy is the better part of valour. No need to thank me, ma'am. Virtue is its own reward." loading="lazy" decoding="async">
<img src="024.webp" width="1000" height="1125" alt="McGonagall: So it is. But I do have a very special something else to give you. I see that I have greatly wronged you in my thoughts, Mr Potter. / McGonagall: Please wait here." loading="lazy" decoding="async">
<img src="025.webp" width="1000" height="950" alt="A blur, like a frosted-glass curtain, hides McGonagall at the locked door. / She went to the locked back door, waved her wand, and a blurry curtain sprang up around her. Harry could neither see nor hear what was going on." loading="lazy" decoding="async">
<img src="026.webp" width="1000" height="1125" alt="The Time-Turner: a silver ring with a tiny hourglass inside, on a fine gold chain. / In one hand, she held a necklace: a thin golden chain bearing a silver circle, and within the circle, the device of an hourglass." loading="lazy" decoding="async">
<img src="027.webp" width="1000" height="1025" alt="Harry: Wow! A neat magical item as a quest reward! So refusing money until you got a magic item actually worked in real life, not just in computer games." loading="lazy" decoding="async">
<img src="028.webp" width="1000" height="1250" alt="McGonagall: Mr Potter, this item is ordinarily lent only to children who have already shown themselves to be highly responsible. Its true nature is secret. You must not tell any of the other students about it, or let them see you using it." loading="lazy" decoding="async">
<img src="029.webp" width="1000" height="1475" alt="McGonagall: So far as the other students are concerned, it is a Spimster wicket, used to treat a rare, non-contagious magical ailment called Spontaneous Duplication. / McGonagall: You have no reason to show it to anyone. But no reason to treat it as an awful secret, either. Spimster wickets are not interesting." loading="lazy" decoding="async">
<img src="030.webp" width="1000" height="1050" alt="Harry: He sensed the work of a competent Slytherin. / Harry: And what does it really do?" loading="lazy" decoding="async">
<img src="031.webp" width="1000" height="1438" alt="McGonagall: It's a Time-Turner. Each spin of the hourglass sends you one hour back in time. / McGonagall: So if you use it to go back two hours every day, you should always be able to get to sleep at the same time." loading="lazy" decoding="async">
<img src="032.webp" width="1000" height="875" alt="Memory: the 26-hour clock diagram from his first day, and the tiny hourglass beside it. / (Back at his parents' house, she had promised him a solution &quot;in time&quot;.)" loading="lazy" decoding="async">
<img src="033.webp" width="1000" height="575" alt="Harry: You're giving me a time machine to treat my sleep disorder." loading="lazy" decoding="async">
<img src="034.webp" width="1000" height="850" alt="Harry: You're giving me a time machine to treat my sleep disorder." loading="lazy" decoding="async">
<img src="035.webp" width="1000" height="1075" alt="Harry's eyes, getting wider and wider. / Harry: YOU'RE GIVING ME A TIME MACHINE TO TREAT MY SLEEP DISORDER." loading="lazy" decoding="async">
<img src="036.webp" width="1000" height="1125" alt="Harry: Ehehehehhheheh… / He was now holding the necklace away from himself as though it were a live bomb. No: that didn't begin to describe it. He was holding it away from himself as though it were a time machine." loading="lazy" decoding="async">
<img src="037.webp" width="1000" height="1313" alt="Harry's pencil sketch: Britain, with a giant smoking crater where Scotland used to be. / Harry: Say, Professor McGonagall, did you know that time-reversed ordinary matter looks just like antimatter?" loading="lazy" decoding="async">
<img src="038.webp" width="1000" height="1025" alt="Harry: Excuse me, but this sounds really really really REALLY DANGEROUS!" loading="lazy" decoding="async">
<img src="039.webp" width="1000" height="950" alt="McGonagall: I'm glad you're taking this seriously, Mr Potter. But Time-Turners aren't that dangerous. We wouldn't give them to children if they were." loading="lazy" decoding="async">
<img src="040.webp" width="1000" height="1563" alt="Harry: Really. Ahahahaha. Of course you wouldn't give time machines to children if they were dangerous, what was I thinking? / Harry: So just to be clear: sneezing on this device will not send me into the Middle Ages, where I will run over Gutenberg with a horse cart and prevent the Enlightenment? Because I hate it when that happens to me." loading="lazy" decoding="async">
<img src="041.webp" width="1000" height="1475" alt="McGonagall: That can't possibly happen, Mr Potter. The Time-Turner cannot be used to go more than six hours back. And it can't be used more than six times in any day. / Harry: Oh, good, very good, that. And if someone bumps into me, it will not break and trap the whole castle of Hogwarts in an endlessly repeating loop of Thursdays?" loading="lazy" decoding="async">
<img src="042.webp" width="1000" height="1375" alt="McGonagall: Well, they can be fragile… and I do think I've heard about strange things happening if they're broken. But nothing like that! / Harry: Perhaps you ought to give your time machines some sort of protective shell, rather than leaving the glass exposed." loading="lazy" decoding="async">
<img src="043.webp" width="1000" height="1100" alt="McGonagall: That's an excellent idea, Mr Potter. I shall inform the Ministry of it. / Harry: That's it. It's official now. They've ratified it in Parliament. Everyone in the wizarding world is completely stupid." loading="lazy" decoding="async">
<img src="044.webp" width="1000" height="1250" alt="Harry: And while I hate to get philosophical, has anyone thought about the implications of going back six hours and changing something, which would pretty much delete everyone affected and replace them with different versions—" loading="lazy" decoding="async">
<img src="045.webp" width="1000" height="1125" alt="McGonagall: Oh, you can't change time! Good heavens, do you think these would be allowed students if that were possible? What if someone tried to change their test scores?" loading="lazy" decoding="async">
<img src="046.webp" width="1000" height="1250" alt="Harry: So… people just find that the universe happens to be self-consistent, somehow, even though it has time travel in it. If I meet my future self, he's already acting in full knowledge of things that, for me, haven't happened yet… / His voice trailed off into the inadequacy of English." loading="lazy" decoding="async">
<img src="047.webp" width="1000" height="1688" alt="McGonagall: Wizards are advised to avoid being seen by their past selves. The first version of you should step aside and close his eyes at a known time. It's all in the pamphlet. / Harry: And it doesn't, say, create a paradox that destroys the universe. / McGonagall: Mr Potter, I think I'd remember hearing if that had ever happened." loading="lazy" decoding="async">
<img src="048.webp" width="1000" height="1475" alt="Harry, arms flailing, at full volume. / Harry: THAT IS NOT REASSURING! HAVEN'T YOU PEOPLE EVER HEARD OF THE ANTHROPIC PRINCIPLE? AND WHAT IDIOT EVER BUILT ONE OF THESE THINGS FOR THE FIRST TIME?" loading="lazy" decoding="async">
<img src="049.webp" width="1000" height="1438" alt="Professor McGonagall actually laughed. It was a pleasant, glad sound that seemed surprisingly out of place on that stern face. / McGonagall: You're having another &quot;you turned into a cat&quot; moment, aren't you, Mr Potter? You probably don't want to hear this, but it's quite endearingly cute." loading="lazy" decoding="async">
<img src="050.webp" width="1000" height="1375" alt="Harry: Turning into a cat doesn't even begin to compare to this! A Turing machine could simulate going back to a moment and computing a different future. But what you're saying is that reality somehow computes itself in one sweep, using information that hasn't… happened… yet…" loading="lazy" decoding="async">
<img src="051.webp" width="1000" height="1025" alt="Light bursts behind Harry's wide eyes. / Realisation struck Harry a pile-driver blow." loading="lazy" decoding="async">
<img src="052.webp" width="1000" height="1725" alt="Harry's diagram: &quot;drink Comed-Tea → funny thing&quot; crossed out; instead &quot;funny thing (about to happen)&quot; with an arrow pointing backwards in time to &quot;sudden urge to drink&quot;. / Harry: So THAT'S how the Comed-Tea works! The spell doesn't make funny things happen. It makes you feel an urge to drink right before something funny is going to happen anyway!" loading="lazy" decoding="async">
<img src="053.webp" width="1000" height="1125" alt="Harry: I'm such a fool! Last night I felt the urge to drink, didn't, and choked on my own spit anyway! The comedy causes the drinking! It all makes sense once you draw the causal arrows going backwards in time!" loading="lazy" decoding="async">
<img src="054.webp" width="1000" height="1025" alt="Realisation struck Harry the second pile-driver. / This one he managed to keep quiet, making only a small strangled sound, like a dying kitten, as he realised who had put the note on his bed this morning." loading="lazy" decoding="async">
<img src="055.webp" width="1000" height="1375" alt="McGonagall: After you graduate, or possibly even before, you really must teach some of these Muggle theories at Hogwarts, Mr Potter. They sound quite fascinating, even if they're all wrong. / Harry: Glehhahhh…" loading="lazy" decoding="async">
<img src="056.webp" width="1000" height="1025" alt="Somehow Harry found himself standing outside her office, with the door closed firmly behind him. / Harry: Gaahhhrrrraa… / Why yes, his mind was blown." loading="lazy" decoding="async">
<img src="057.webp" width="1000" height="1250" alt="An empty map with a single faint question mark. / He had always believed that if you were ignorant about something, that was a fact about you, not about the thing. A blank map did not mean a blank territory. There were mysterious questions, but never mysterious answers. / Now, for the first time, he faced a mystery that might be permanent. His brain was made of neurons that only ran forwards in time. There might be nothing it could ever do to understand this." loading="lazy" decoding="async">
<img src="058.webp" width="1000" height="525" alt="Five hours earlier." loading="lazy" decoding="async">
<img src="059.webp" width="1000" height="1250" alt="Dawn in the dorm. Harry (in bed, asleep) and Harry (dressed, robe over his head) creeping in. By the bed, a Christmas-wrapped present. / Five hours earlier, Harry was sneaking into his dorm with his robes pulled up over his head, in case someone saw him at the same time as Harry lying in bed. He didn't want to explain about his little medical problem with Spontaneous Duplication. / Everyone was still asleep. And there was a box by his bed, in red and green paper with a golden ribbon." loading="lazy" decoding="async">
<img src="060.webp" width="1000" height="1575" alt="The letter that came with the present. / This is the Cloak of Invisibility of Ignotus Peverell, passed down through his descendants the Potters. Unlike lesser cloaks and spells, it has the power to keep you hidden, not merely invisible. Your father lent it to me to study shortly before he died.  It is time the Cloak was returned to you, its heir. I had thought to make this a Christmas present, but it wished to come back to your hand before then. It seems to expect you to have need of it. Use it well.  No doubt you are already thinking of all manner of wonderful pranks, as your father committed in his day. I shall not try to stop history from repeating. But be most careful not to reveal yourself. If Dumbledore saw a chance to possess one of the Deathly Hallows, he would never let it escape his grasp until the day he died.  A Very Merry Christmas to you. / The note was unsigned." loading="lazy" decoding="async">
<img src="061.webp" width="1000" height="1250" alt="Morning. The other boys, dressed, on their way out; Harry hanging back. / Harry: Hold on. There's something else I've got to do with my trunk. I'll be along to breakfast in a couple of minutes. / Terry: You'd better not be planning to go through any of our things." loading="lazy" decoding="async">
<img src="062.webp" width="1000" height="1438" alt="Harry: I swear that I intend to do nothing of the sort to any of your things, that I only intend to access objects that I myself own, that I have no pranking or otherwise questionable intentions towards any of you, and that I do not anticipate those intentions changing before I get to breakfast in the Great Hall." loading="lazy" decoding="async">
<img src="063.webp" width="1000" height="1150" alt="Terry: Wait, is that… / Penelope: Don't worry. There were no loopholes. Well-worded, Potter. You should be a lawyer. / Harry: Thank you. I think." loading="lazy" decoding="async">
<img src="064.webp" width="1000" height="1438" alt="Penelope: When you try to find the Great Hall, you will get lost. Ask a portrait the instant you suspect you might be lost. If you are higher than the whole castle ought to be, stop and wait for search parties. / Penelope: Otherwise we shall see you again four months later, and you will be five months older, and dressed in a loincloth, and covered in snow. And that's if you stay inside the castle." loading="lazy" decoding="async">
<img src="065.webp" width="1000" height="1188" alt="Harry: Understood. Um, shouldn't you tell students all that sort of stuff right away? / Penelope: What, all of it? That would take weeks. You'll pick it up as you go along." loading="lazy" decoding="async">
<img src="066.webp" width="1000" height="1250" alt="Harry, dressed, peels a shimmering cloak off the sleeping Harry in the bed. / He attached the note to his bed—he'd already written it, and all the others, down in his trunk before anyone woke. Then he reached inside the Quietus field and pulled the Cloak of Invisibility off the still-sleeping Harry. / And, just for the sake of mischief, he put the Cloak into that Harry's pouch. Knowing it would thereby already be in his own." loading="lazy" decoding="async">
<img src="067.webp" width="1000" height="1875" alt="Writing notes. / Harry: I was told it was spoken by a hollow voice that belled forth from a gap within the air itself… / Hermione: That's everyone's dessert! / Sprout: And how do you know what the Slytherins are planning?" loading="lazy" decoding="async">
<img src="068.webp" width="1000" height="1438" alt="Harry: I can't name my source. In fact, I have to ask you to pretend this conversation never happened. Just act like you came across them naturally. / Harry: I'll distract them until you get there. I don't think they'll dare seriously hurt the Boy-Who-Lived. But I'd appreciate it if you didn't dawdle." loading="lazy" decoding="async">
<img src="069.webp" width="1000" height="1025" alt="Professor Sprout looked at him for a long moment. Then her face softened. / Sprout: Please be careful with yourself, Harry Potter. And… thank you." loading="lazy" decoding="async">
<img src="070.webp" width="1000" height="1100" alt="A faint shimmer in the corridor, in the shape of a boy, hurls a blueberry pie at the Slytherin's head. / Where had the pies come from? From a boy nobody could see." loading="lazy" decoding="async">
<img src="071.webp" width="1000" height="1025" alt="From the invisible Harry's point of view: the other Harry yanking Neville out of the ring, much too hard. / It was horrible, watching himself yank Neville out of the circle of Slytherins. Neville had been right. He'd used too much force. Way too much force." loading="lazy" decoding="async">
<img src="072.webp" width="1000" height="1200" alt="The whole scene from outside: seven frightened first-years, and one small cold boy in the middle of the Slytherins. / Harry: Hello. I'm the Boy-Who-Lived. / Eight first-year boys, all about the same height. One of them had a scar on his forehead, and he wasn't acting like the others." loading="lazy" decoding="async">
<img src="073.webp" width="1000" height="875" alt="O wad some Power the giftie gie us To see oursels as ithers see us! It wad frae mony a blunder free us, An' foolish notion. / Robert Burns" loading="lazy" decoding="async">
<img src="074.webp" width="1000" height="1025" alt="Harry's cold face, seen as the others see it. / Professor McGonagall was right. The Sorting Hat was right. It was clear, once you saw it from the outside. / There was something wrong with Harry Potter." loading="lazy" decoding="async">
