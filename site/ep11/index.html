<img src="002.webp" width="1000" height="1625" alt="First sight of Hogwarts: a vast castle of towers and turrets on a cliff, every window lit gold, above a black lake crossed by a flotilla of small lantern-lit boats. A full moon, a sky full of stars. / The train pulled in after dark. Then there were boats—little ones, with lanterns—and a great black lake. / And then, across the water, there was Hogwarts." decoding="async">
<img src="003.webp" width="1000" height="1025" alt="In a small boat: Neville, dazed, clutching his toad; Harry, awestruck; Hermione, lecturing happily. / Neville had his toad back. (A Ravenclaw prefect had jabbed her wand at him without even looking up from her book, and he'd wandered off in a daze, straight to it.) / Hermione: It's bewitched so it can't be reached except by the lake! I read it in Hogwarts: A History!" decoding="async">
<img src="004.webp" width="1000" height="950" alt="Harry: And the Sorting? Is it a test? Nobody will tell me what the test is." loading="lazy" decoding="async">
<img src="005.webp" width="1000" height="950" alt="Hermione: It's a Hat. An eight-hundred-year-old artefact of forgotten magic. You put it on and it looks inside your mind and tells you where you belong! / Harry: A telepathic hat. Of course. Why not." loading="lazy" decoding="async">
<img src="006.webp" width="1000" height="1750" alt="The Great Hall: four long house tables packed with students running toward a high table on a dais; thousands of candles floating in the air; the ceiling bewitched into a starry night sky; house banners on the walls. / The Great Hall. / Thousands of candles floated in mid-air. The ceiling wasn't there at all—only the night sky, full of stars." loading="lazy" decoding="async">
<img src="007.webp" width="1000" height="950" alt="Hermione: It's bewitched to look like the sky outside! / Harry: Of course it is." loading="lazy" decoding="async">
<img src="008.webp" width="1000" height="1025" alt="The Sorting Hat on its stool, singing through the rip in its brim. / On a stool on the dais sat a patched and frayed old wizard's hat. Then a rip near its brim opened wide like a mouth—and it began to sing. / Sorting Hat: ♪ Oh, I'm the Sorting Hat and I'm okay—I sleep all year and I work one day… ♪" loading="lazy" decoding="async">
<img src="009.webp" width="1000" height="700" alt="Harry: Was the Hat conscious? In the sense of being aware of its own awareness? And if so, was it satisfied with only getting to talk to eleven-year-olds once a year?" loading="lazy" decoding="async">
<img src="010.webp" width="1000" height="875" alt="McGonagall: &quot;Abbott, Hannah!&quot;" loading="lazy" decoding="async">
<img src="011.webp" width="1000" height="550" alt="Abbott, Hannah / Bones, Susan / Boot, Terry" loading="lazy" decoding="async">
<img src="012.webp" width="1000" height="1250" alt="The staff at the High Table: Trelawney, Sprout, Snape with a silver goblet, Dumbledore, Quirrell twitching, tiny Flitwick standing on his chair, and the enormous Hagrid. / At the High Table: a wizened ancient with a silver-white beard, in a great golden chair, applauding every student as if freshly delighted by each. To his left, a man with sharp eyes and a dour face, who applauded no-one—and who somehow looked straight back at Harry every time Harry looked at him. / And further along, the pale man from the Leaky Cauldron—whose eyes darted around in panic, and who twitched in his seat. For some reason, Harry kept finding himself staring at him." loading="lazy" decoding="async">
<img src="013.webp" width="1000" height="700" alt="Quirrell, twitching. The same wrong hum as before. / mmmmmmmm" loading="lazy" decoding="async">
<img src="014.webp" width="1000" height="950" alt="Harry: Is the man standing on his chair the Head of Ravenclaw? / Clearwater: That is Professor Filius Flitwick—the most knowledgeable Charms Master alive, and a past Duelling Champion. He does have goblin ancestry—" loading="lazy" decoding="async">
<img src="015.webp" width="1000" height="875" alt="Harry: What? How is that possible? You can't mix two different species and get viable offspring! Where did goblins come from, anyway?" loading="lazy" decoding="async">
<img src="016.webp" width="1000" height="700" alt="Hermione: Lithuania. / …Hermione whispered absently, her eyes still fixed firmly on the Sorting Hat. Now she was getting a smile from the prefect." loading="lazy" decoding="async">
<img src="017.webp" width="1000" height="525" alt="Harry: Never mind." loading="lazy" decoding="async">
<img src="018.webp" width="1000" height="950" alt="Hermione was bouncing on her tiptoes so hard her feet were actually leaving the ground. / McGonagall: &quot;Granger, Hermione!&quot;" loading="lazy" decoding="async">
<img src="019.webp" width="1000" height="1025" alt="She ran full tilt, and jammed the patchy old eight-hundred-year-old artefact of forgotten magic down hard over her head. Harry winced." loading="lazy" decoding="async">
<img src="020.webp" width="1000" height="575" alt="RAVENCLAW!" loading="lazy" decoding="async">
<img src="021.webp" width="1000" height="875" alt="Harry: Talk about your foregone conclusions. In what weird alternative universe would that girl not be sorted into Ravenclaw? / Harry: Harry knew pi to 3.141592, because that's accurate enough for most purposes. Hermione knew a hundred digits, because that's how many were printed in the back of her maths book." loading="lazy" decoding="async">
<img src="022.webp" width="1000" height="575" alt="Longbottom, Neville / Malfoy, Draco" loading="lazy" decoding="async">
<img src="023.webp" width="1000" height="950" alt="Harry: Neville in Hufflepuff. Good. A Houseful of reliable friends would do him a whole world of good. / Harry: Clever kids in Ravenclaw, evil kids in Slytherin, wannabe heroes in Gryffindor—and everyone who does the actual work in Hufflepuff." loading="lazy" decoding="async">
<img src="024.webp" width="1000" height="375" alt="And Draco to Slytherin, as planned. You never did know what tiny event might upset the course of your master plan." loading="lazy" decoding="async">
<img src="025.webp" width="1000" height="950" alt="With a note of trepidation so firmly kept from her voice and face that you'd have needed to know her very well indeed to notice, Minerva McGonagall inhaled deeply— / McGonagall: &quot;Potter, Harry!&quot;" loading="lazy" decoding="async">
<img src="026.webp" width="1000" height="1125" alt="Every student in the Hall turns to stare. / All conversation stopped. All eyes turned to stare." loading="lazy" decoding="async">
<img src="027.webp" width="1000" height="775" alt="Harry: For the first time in his entire life, Harry felt like he might be having an opportunity to experience stage fright." loading="lazy" decoding="async">
<img src="028.webp" width="1000" height="1250" alt="At the Gryffindor table, the Weasley twins leap up and start chanting. / Fred: HARRY POTTER! / George: HARRY POTTER!" loading="lazy" decoding="async">
<img src="029.webp" width="1000" height="1500" alt="The whole Hall chants his name. / hall: HARRY POTTER! HARRY POTTER! HARRY POTTER!" loading="lazy" decoding="async">
<img src="030.webp" width="1000" height="1125" alt="And Harry Potter walked forwards—much too slowly, he realised once he'd begun, but by then it was too late to change pace without looking awkward. So he put on a wide grin, bowed to one side and then the other, and walked on at a grandly measured pace, like a prince inheriting his castle." loading="lazy" decoding="async">
<img src="031.webp" width="1000" height="1125" alt="fanning herself / clapping along / …vacant / beaming / curious / And Severus Snape, gripping his wine goblet so hard that the silver was slowly deforming." loading="lazy" decoding="async">
<img src="032.webp" width="1000" height="950" alt="Fred: Save us from some more Dark Lords! / George: Especially if they're Professors!" loading="lazy" decoding="async">
<img src="033.webp" width="1000" height="950" alt="Snape, faintly smiling, looking straight at Harry, a crushed silver goblet in his hands. / Severus Snape's face had gone beyond rage into a kind of pleasant indifference. A faint smile played about his lips. / He was looking at Harry Potter—not the Gryffindor table. And his hands held the crumpled remains of a former wine goblet." loading="lazy" decoding="async">
<img src="034.webp" width="1000" height="575" alt="(Surely he realised the Potter boy had no idea who that was about—)" loading="lazy" decoding="async">
<img src="035.webp" width="1000" height="1375" alt="Harry: They were cheering him for a job he'd done when he was one year old. A job he hadn't really finished. Somewhere, somehow, the Dark Lord was still alive. Would they cheer so hard if they knew? / Harry: He couldn't stand to let it be false. To flash and fade like so many child prodigies. To be a disappointment. / Harry: He would fulfil their expectations. And then exceed them—so that people wondered, looking back, that they had once asked so little of him." loading="lazy" decoding="async">
<img src="036.webp" width="1000" height="950" alt="He swept a bow to the Order of Chaos at the Gryffindor table, and another to the rest of the Hall, and waited for the applause and giggling to die away." loading="lazy" decoding="async">
<img src="037.webp" width="1000" height="1025" alt="Then he sat on the stool, and carefully placed the eight-hundred-year-old telepathic artefact onto his head." loading="lazy" decoding="async">
<img src="038.webp" width="1000" height="1250" alt="Inside Harry's head: an endless candlelit library, and his questions tumbling out. / Harry: Don't Sort me yet! I have questions! Have I ever been Obliviated? Did you Sort the Dark Lord when he was a child—can you tell me his weaknesses? Why did I get the brother wand to his? / Harry: Is the Dark Lord's ghost bound to my scar, and is that why I get so angry sometimes? And if you've got a moment—how do I rediscover the lost magics that created you?" loading="lazy" decoding="async">
<img src="039.webp" width="1000" height="575" alt="Into the silence of Harry's spirit, where before there had never been any voice but one, there came a second voice." loading="lazy" decoding="async">
<img src="040.webp" width="1000" height="1250" alt="In the dark of Harry's mind, a gigantic, patched, worried Sorting Hat looms. / Sorting Hat: Oh, dear. / Sorting Hat: This has never happened before…" loading="lazy" decoding="async">
