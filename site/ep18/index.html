<img src="001.webp" width="1000" height="413" alt="BOOK TWO · THE FIRST WEEK / CHAPTER EIGHTEEN / Do Not Mess With Time" decoding="async">
<img src="002.webp" width="1000" height="375" alt="Thursday. / If you wanted to be specific, 7:24 on Thursday morning." decoding="async">
<img src="003.webp" width="1000" height="1125" alt="Harry was sitting on his bed, a textbook lying limp in his hands. He had just had an idea for a truly brilliant experimental test. / It absolutely positively had to be tested right away. Immediately. Now." decoding="async">
<img src="004.webp" width="1000" height="1325" alt="Harry: Excuse me, can you do something for me? Pick two three-digit numbers from this list of primes. Don't tell me what they are. Just multiply them together and tell me the product." loading="lazy" decoding="async">
<img src="005.webp" width="1000" height="1125" alt="Harry: Oh, and do the calculation twice to double-check? Please make really sure. I'm not sure what's going to happen to me or the universe if you make a multiplication error. / It said a lot about life in that dorm that Anthony Goldstein didn't even ask." loading="lazy" decoding="async">
<img src="006.webp" width="1000" height="800" alt="Anthony: One hundred and eighty-one thousand, four hundred and twenty-nine." loading="lazy" decoding="async">
<img src="007.webp" width="1000" height="1250" alt="Harry sits on the floor of his trunk's cavern level, eyes squeezed shut. Footsteps. Something set down. Footsteps leaving. / Harry raced down into the cavern level of his trunk, checked his watch, and shut his eyes. Around thirty seconds later, he heard footsteps. Then the sound of the trunk lid sliding shut. / tap tap tap / shhk" loading="lazy" decoding="async">
<img src="008.webp" width="1000" height="875" alt="When he opened his eyes, he saw just what he'd been hoping to see: a folded piece of paper on the floor. The gift of his future self." loading="lazy" decoding="async">
<img src="009.webp" width="1000" height="1450" alt="Harry's pencil algorithm for a time loop that factors a number, drawn as a flowchart. / The algorithm: / If the paper is blank: write &quot;101 × 101&quot; on it. / If it has two numbers: multiply them. / If the product is 181,429: copy them out, send them back. / If not: try the next pair. Send that back. / When I'm done: go back in time an hour, and drop off the paper. / So the only possible stable time loop was the one in which the paper already held the answer. If this worked, he could find any answer that was hard to find but easy to check. Combination locks. Passwords. Maybe even the entrance to the Chamber of Secrets." loading="lazy" decoding="async">
<img src="010.webp" width="1000" height="950" alt="Harry took the paper in his trembling hand, and unfolded it." loading="lazy" decoding="async">
<img src="011.webp" width="1000" height="1200" alt="The paper says, in slightly shaky handwriting: DO NOT MESS WITH TIME. / DO NOT MESS WITH TIME" loading="lazy" decoding="async">
<img src="012.webp" width="1000" height="1438" alt="Harry wrote down &quot;DO NOT MESS WITH TIME&quot; on a fresh piece of paper, in slightly shaky handwriting, and folded it neatly. / He resolved not to do any more truly brilliant experiments on Time until he was at least fifteen. To the best of his knowledge, it had been the scariest experimental result in the entire history of science." loading="lazy" decoding="async">
<img src="013.webp" width="1000" height="325" alt="Thursday. / If you wanted to be specific, 3:32 on Thursday afternoon." loading="lazy" decoding="async">
<img src="014.webp" width="1000" height="1100" alt="A bright field. A row of first-year boys beside broomsticks on the grass. Madam Hooch, grey-haired, yellow-eyed. / All the first-year boys, out on a grassy field with Madam Hooch, standing next to the Hogwarts supply of broomsticks. (For some reason, the girls learned separately.) / It was a clear day, with a brilliant sun just begging to get in your eyes. The ground was nice and dry. It felt very, very hard." loading="lazy" decoding="async">
<img src="015.webp" width="1000" height="1250" alt="Harry: Broomsticks? Seriously? He was going to fly on, basically, a line segment? Wasn't that the single most unstable shape you could possibly find? There was no way the optimal designs for cleaning kitchens and for flying happened to coincide." loading="lazy" decoding="async">
<img src="016.webp" width="1000" height="925" alt="Hooch: Stick out your right hand over the broom, and say, Up! / Boys: UP!" loading="lazy" decoding="async">
<img src="017.webp" width="1000" height="1250" alt="The broomstick leapt eagerly into Harry's hand. Which put him at the head of the class, for once. Most of the other brooms were rolling around on the ground, or trying to inch away from their would-be riders. / Harry: (If it turned out to be broomstick riding he could beat Hermione at, instead of anything intellectual, Harry would just die.)" loading="lazy" decoding="async">
<img src="018.webp" width="1000" height="1000" alt="Hooch: When I blow my whistle, you kick off from the ground, hard. Rise a few feet, then come straight back down by leaning forwards slightly. On my whistle—three—two—" loading="lazy" decoding="async">
<img src="019.webp" width="1000" height="1500" alt="A broom rockets skyward with a small boy clinging to it, spinning. / One of the brooms shot skyward, before the whistle. Its rider was screaming. Of horror, not delight. He was spinning at an awful rate, and they only got glimpses of his white face… / Neville: Aaaaaaaa!" loading="lazy" decoding="async">
<img src="020.webp" width="1000" height="1250" alt="Harry: If there is any hidden power in me, let it reveal itself now! / Harry: Wingardium Leviosa!" loading="lazy" decoding="async">
<img src="021.webp" width="1000" height="700" alt="The spell failed. He could feel it fail." loading="lazy" decoding="async">
<img src="022.webp" width="1000" height="900" alt="The boy lies face down on the grass in a heap. / THUD / crack" loading="lazy" decoding="async">
<img src="023.webp" width="1000" height="1363" alt="Harry, in full panic, has the Emergency Healing Pack open and a syringe of liquid fire in his hand. / Harry: Healer's Pack! / Hooch: Broken wrist! Calm down, boy, he just has a broken wrist!" loading="lazy" decoding="async">
<img src="024.webp" width="1000" height="1250" alt="There was a sort of mental lurch as Harry's mind snapped out of Panic Mode. In his hand was a syringe of liquid fire, which would have kept the boy's brain oxygenated if he'd snapped his neck. / Harry: Ah… broken bone… right… Setting String?" loading="lazy" decoding="async">
<img src="025.webp" width="1000" height="1125" alt="Hooch: That's for emergencies only. Put it away, he's fine. / It was Neville Longbottom again. What was with him?" loading="lazy" decoding="async">
<img src="026.webp" width="1000" height="1125" alt="Hooch: None of you is to move while I take this boy to the hospital wing! Leave those brooms where they are, or you'll be out of Hogwarts before you can say Quidditch." loading="lazy" decoding="async">
<img src="027.webp" width="1000" height="1250" alt="When they were out of earshot, one of the Slytherins started giggling. That set off the others. / Harry turned and looked at them. It seemed like a good time to memorise some faces." loading="lazy" decoding="async">
<img src="028.webp" width="1000" height="1375" alt="Draco's face is very controlled and twitches occasionally: he thinks it's hilarious, but there's no political advantage in laughing now. / Draco: Just wanted to say, Potter: when you take advantage of emergencies to demonstrate leadership, you want to look like you're in total control of the situation. Rather than, say, going into a complete panic. / Draco: But you probably scored a few points anyway." loading="lazy" decoding="async">
<img src="029.webp" width="1000" height="1438" alt="Ernie: Thank you, Harry Potter, on behalf of Hufflepuff. It was a good try, and a good thought. / Draco: A good thought indeed. Why didn't anyone in Hufflepuff have their wands out? I thought Hufflepuffs were supposed to stick together? I guess that's why it's better to have one Ravenclaw as a friend than all of Hufflepuff." loading="lazy" decoding="async">
<img src="030.webp" width="1000" height="1250" alt="Goyle picks up a glass marble full of swirling white mist. / Goyle: Hey, what's this? / Ernie: Neville's Remembrall! It turns red if you've forgotten something. Give it here, please, and I'll hand it back to him later." loading="lazy" decoding="async">
<img src="031.webp" width="1000" height="1500" alt="Goyle, on a broom, soaring up above the field, the Remembrall in his hand. / Goyle: Come and get it, Hufflepuffle! / Hadn't Madam Hooch said that would get him expelled? The Slytherins started cheering and hooting." loading="lazy" decoding="async">
<img src="032.webp" width="1000" height="1375" alt="Draco's face twists in agony. / Harry: Draco, if you don't order that idiot back on the ground, the teacher's going to get back and— / Draco: I can't! Everyone in Slytherin would think I'm weak! / Harry: And if Mr Goyle gets expelled, your father is going to think you're a moron!" loading="lazy" decoding="async">
<img src="033.webp" width="1000" height="1900" alt="Ernie: Hufflepuffs stick together! Wands out, Hufflepuff! / Slytherins: Wands out, Slytherin! / Dean: Wands out, Gryffindor! / Michael: Wands out, Ravenclaw! / (Michael Corner, who was apparently feeling left out.)" loading="lazy" decoding="async">
<img src="034.webp" width="1000" height="1125" alt="Draco: Do something, Potter! I can't be the one to stop this, it has to be you! I'll owe you a favour, just think of something! Aren't you supposed to be brilliant?" loading="lazy" decoding="async">
<img src="035.webp" width="1000" height="950" alt="In around five and a half seconds, someone was going to cast a Simple Strike Hex. And by the time the teachers were done expelling people, the only boys left in his year would be Ravenclaws." loading="lazy" decoding="async">
<img src="036.webp" width="1000" height="1200" alt="Harry, pointing at the sky, at the top of his lungs. / Harry: GREGORY GOYLE! I challenge you to a contest for possession of Neville's Remembrall!" loading="lazy" decoding="async">
<img src="037.webp" width="1000" height="1250" alt="Draco: Oh, really? That sounds interesting. What sort of contest, Potter? / Harry: &quot;Contest&quot; had been as far as his inspiration had got. Not chess: Draco couldn't accept that without it looking strange. Not arm-wrestling: Goyle would crush him…" loading="lazy" decoding="async">
<img src="038.webp" width="1000" height="1250" alt="Harry: We stand apart. No-one else comes near either of us. No wands. If I can get my hands on Neville's Remembrall without moving, Gregory Goyle gives me the one he's holding." loading="lazy" decoding="async">
<img src="039.webp" width="1000" height="1250" alt="Draco: Hah, Potter! I'd like to see you do that! Mr Goyle accepts! / Draco: Potter, what? / (which he somehow did without moving his lips)" loading="lazy" decoding="async">
<img src="040.webp" width="1000" height="1438" alt="Harry raises one hand, fingers ready to snap. Gasps from anyone who has heard about the pies, which is practically everyone. / Harry stopped a few paces from Mr Goyle, far enough that they couldn't reach each other. Slowly, deliberately, he sheathed his wand. Everyone backed away. / Harry: I call upon the insanity of Hogwarts! Happy happy boom boom swamp swamp swamp!" loading="lazy" decoding="async">
<img src="041.webp" width="1000" height="1125" alt="SNAP / A lot of people flinched. And nothing happened." loading="lazy" decoding="async">
<img src="042.webp" width="1000" height="1188" alt="Dean: Um. Is that it? / Harry: Look in front of you. That patch of ground with no grass on it? Dig it up." loading="lazy" decoding="async">
<img src="043.webp" width="1000" height="1188" alt="Dean kneels and scoops away dirt. Nothing. / Terry: Just do it. No point asking why, trust me on this one. / After a minute: &quot;There's nothing there.&quot;" loading="lazy" decoding="async">
<img src="044.webp" width="1000" height="1025" alt="Harry: Huh. He'd been planning to go back in time and bury a treasure map there. Then Harry realised there was a much simpler way, which didn't threaten the secret of Time-Turners quite as much." loading="lazy" decoding="async">
<img src="045.webp" width="1000" height="1125" alt="Harry: Ernie, would you look around on the ground where Neville fell, and see if you can find Neville's Remembrall?" loading="lazy" decoding="async">
<img src="046.webp" width="1000" height="1075" alt="Ernie holds up a Remembrall he has just found on the grass. / Ernie: Merlin! It's here! Right where he fell!" loading="lazy" decoding="async">
<img src="047.webp" width="1000" height="1025" alt="Mr Goyle looked down, and saw that he was still holding Neville's Remembrall." loading="lazy" decoding="async">
<img src="048.webp" width="1000" height="1325" alt="Harry shrugs, perfectly deadpan. / Dean: Er. That's not possible, is it? / Harry: It's a plot hole. I made myself weird enough to distract the universe for a moment, and it forgot that Goyle had already picked up the Remembrall." loading="lazy" decoding="async">
<img src="049.webp" width="1000" height="800" alt="Dean: No, wait, I mean, that's totally not possible—" loading="lazy" decoding="async">
<img src="050.webp" width="1000" height="1438" alt="Zabini: Hold on! How do we know that's Neville's Remembrall? You could've just dropped another one there! / Crabbe: Shut up, you. Mr Malfoy doesn't need you to tell him what to do! / Harry: Good minion." loading="lazy" decoding="async">
<img src="051.webp" width="1000" height="1250" alt="Harry: The Slytherin is strong with this one. But you have my word that the one Ernie's holding is Neville's. No comment about the one Gregory Goyle's holding. I leave the judgement of the bet to Mr Malfoy." loading="lazy" decoding="async">
<img src="052.webp" width="1000" height="1250" alt="Draco: You promise that actually is Neville's Remembrall? / Harry: Yes. That's the one that'll go back to Neville, and it was his originally." loading="lazy" decoding="async">
<img src="053.webp" width="1000" height="1125" alt="Draco: I won't question the word of the Noble House of Potter, then, no matter how strange that all was. And the Noble and Most Ancient House of Malfoy keeps its word as well. Mr Goyle, give that to Mr Potter—" loading="lazy" decoding="async">
<img src="054.webp" width="1000" height="1125" alt="Ernie: Catch, Harry! / Harry: There. I win…" loading="lazy" decoding="async">
<img src="055.webp" width="1000" height="1500" alt="The Remembrall blazes red in Harry's hand. / Harry trailed off. All conversation stopped. / The Remembrall was glowing bright red in his hand, blazing like a miniature sun, casting shadows on the ground in broad daylight." loading="lazy" decoding="async">
<img src="056.webp" width="1000" height="425" alt="Thursday. / If you wanted to be specific, 5:09 on Thursday afternoon, in Professor McGonagall's office. (With an extra hour for Harry slipped in between.)" loading="lazy" decoding="async">
<img src="057.webp" width="1000" height="1438" alt="McGonagall: You are not to use the Time-Turner in that fashion, Mr Potter! Is the concept of secrecy not something that you understand?" loading="lazy" decoding="async">
<img src="058.webp" width="1000" height="1375" alt="Harry: Professor, Slytherin was pointing their wands at Hufflepuff, Gryffindor at Slytherin, some idiot called wands out in Ravenclaw, and I had maybe five seconds to keep the whole thing from blowing sky-high! / Harry: They don't know how I did it! They just think I can do really weird things by snapping my fingers! I had to do it!" loading="lazy" decoding="async">
<img src="059.webp" width="1000" height="1875" alt="McGonagall: You did not have to do it! All you needed was to get this anonymous Slytherin back on the ground! You could have challenged him to a game of Exploding Snap! / McGonagall: But no, you had to use the Time-Turner in a flagrant and unnecessary manner!" loading="lazy" decoding="async">
<img src="060.webp" width="1000" height="1100" alt="Harry: It was all I could think of! They wouldn't have accepted chess, and if I'd picked arm-wrestling I would have lost!" loading="lazy" decoding="async">
<img src="061.webp" width="1000" height="1250" alt="McGonagall, at full volume. / McGonagall: Then you should have picked WRESTLING!" loading="lazy" decoding="async">
<img src="062.webp" width="1000" height="950" alt="Harry: But then I'd have lost— / Harry stopped." loading="lazy" decoding="async">
<img src="063.webp" width="1000" height="1250" alt="It was suddenly apparent that he'd had a lot of other options. He could have asked Draco to suggest something. He could have asked the crowd. There had been a giant space of possibilities. Why had he picked that one? / Because he'd seen a way to win. Win possession of an unimportant trinket the teachers would have taken back from Goyle anyway." loading="lazy" decoding="async">
<img src="064.webp" width="1000" height="775" alt="Intent to win. That was what had got him." loading="lazy" decoding="async">
<img src="065.webp" width="1000" height="1025" alt="Harry: I'm sorry. For my pride, and my stupidity." loading="lazy" decoding="async">
<img src="066.webp" width="1000" height="1375" alt="She wipes a hand across her forehead. Some of the anger dissipates. / McGonagall: One more display like that, Mr Potter, and you will be returning that Time-Turner. Do I make myself very clear? / Harry: Yes. I understand, and I'm sorry." loading="lazy" decoding="async">
<img src="067.webp" width="1000" height="1125" alt="Harry: More importantly, why did the Remembrall go off like that? Does it mean I've been Obliviated?" loading="lazy" decoding="async">
<img src="068.webp" width="1000" height="1188" alt="McGonagall: That puzzles me as well. If it were that simple, the courts would use Remembralls, and they do not. I shall look into it, Mr Potter. You can go now." loading="lazy" decoding="async">
<img src="069.webp" width="1000" height="1125" alt="Harry: Um, sorry, I did have something else. It's about Professor Quirrell…" loading="lazy" decoding="async">
<img src="070.webp" width="1000" height="1250" alt="McGonagall: I'm sure, Mr Potter, that it is nothing of importance. Surely you heard the Headmaster tell the students not to bother us with any unimportant complaints about the Defence Professor?" loading="lazy" decoding="async">
<img src="071.webp" width="1000" height="1025" alt="Harry: But this could be important. Yesterday I got this sudden sense of doom when—" loading="lazy" decoding="async">
<img src="072.webp" width="1000" height="1313" alt="McGonagall cuts him off. / McGonagall: Mr Potter! I have a sense of doom as well! And my sense of doom is suggesting that you must not finish that sentence!" loading="lazy" decoding="async">
<img src="073.webp" width="1000" height="1700" alt="Harry: This isn't like you! That seems unbelievably irresponsible! If there's some kind of jinx on the Defence position, if you already know something's going to go wrong, I'd think you'd all be on your toes—" loading="lazy" decoding="async">
<img src="074.webp" width="1000" height="875" alt="Her face is expressionless. / McGonagall: Go wrong, Mr Potter? I certainly hope not." loading="lazy" decoding="async">
<img src="075.webp" width="1000" height="1563" alt="Her face is expressionless. / McGonagall: Last February, Professor Blake was arrested for selling the O.W.L. papers to three fifth-year Slytherins. The year before that, Professor Summers failed so completely as an educator that her students thought a boggart was a kind of furniture. It would be catastrophic if some problem with the extraordinarily competent Professor Quirrell came to my attention now." loading="lazy" decoding="async">
<img src="076.webp" width="1000" height="1375" alt="Harry: I see. So in other words, whatever's wrong with Professor Quirrell, you desperately don't want to know about it until the end of the school year. / Harry: And since it's currently September, he could assassinate the Prime Minister on live television and get away with it, so far as you're concerned." loading="lazy" decoding="async">
<img src="077.webp" width="1000" height="1438" alt="McGonagall: You, and you alone, have reported this mysterious sense of doom. You, and you alone, are a chaos magnet the likes of which I have never seen. I can well foresee that I am fated to sit in the Headmaster's office and hear some hilarious tale about Professor Quirrell in which you, and you alone, play a starring role. After which there will be no choice but to fire him." loading="lazy" decoding="async">
<img src="078.webp" width="1000" height="1250" alt="McGonagall, very close, very calm, very menacing. / McGonagall: And if this sad event takes place any earlier than the Ides of May, I will string you up by the gates of Hogwarts with your own intestines and pour fire beetles into your nose. Now do you understand me completely?" loading="lazy" decoding="async">
<img src="079.webp" width="1000" height="950" alt="Harry nodded, eyes very wide. Then, after a second: / Harry: What do I get if I can make it happen on the last day of the school year?" loading="lazy" decoding="async">
<img src="080.webp" width="1000" height="1313" alt="McGonagall points at the door. / McGonagall: GET OUT OF MY OFFICE!" loading="lazy" decoding="async">
