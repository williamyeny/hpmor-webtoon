<img src="001.webp" width="1000" height="325" alt="CHAPTER NINE / The Moon" decoding="async">
<img src="002.webp" width="1000" height="825" alt="Harry slams the Quibbler down on a picnic table. / Draco: Who've you got in mind? / Harry: The guy who came up with this headline." decoding="async">
<img src="003.webp" width="1000" height="1125" alt="Draco: Not a guy. A girl. A ten-year-old girl, can you believe it? / Draco: She went nuts after her mother died, and her father, who owns the paper, is convinced she's a seer. So he prints whatever Luna Lovegood says." decoding="async">
<img src="004.webp" width="1000" height="950" alt="Harry: Are you kidding me? That's even worse than Muggle journalism, which I would have thought was physically impossible. / Not really thinking about it, Harry opened another can and started to drink." loading="lazy" decoding="async">
<img src="005.webp" width="1000" height="1100" alt="Draco says it lightly, pleasantly, as if it were nothing. / Draco: She has some sort of perverse obsession about the Malfoys, and her father is politically opposed to us, so he prints every word. / Draco: As soon as I'm old enough, I'm going to make her pay. Curse her properly. The kind of curse St Mungo's can't fix." loading="lazy" decoding="async">
<img src="006.webp" width="1000" height="925" alt="Green liquid spurted out of Harry's nostrils. Comed-Tea and lungs did not mix." loading="lazy" decoding="async">
<img src="007.webp" width="1000" height="700" alt="Draco: Something wrong?" loading="lazy" decoding="async">
<img src="008.webp" width="1000" height="1150" alt="The busy platform behind them has gone soft and silent, as if under glass. / It was at this point that Harry realised two things. / One: the sounds of the platform had blurred into white noise, at around the time Draco had reached inside his robes. / Two: when they'd talked about murder as a bonding method, exactly one person in the conversation had thought they were joking." loading="lazy" decoding="async">
<img src="009.webp" width="1000" height="775" alt="Harry: Right. Because he seemed like such a normal kid. And he is a normal kid. He is just what you'd expect a boy to be like if Darth Vader were his doting father." loading="lazy" decoding="async">
<img src="010.webp" width="1000" height="775" alt="Harry: I was just surprised how openly you discussed it. You didn't seem worried about getting caught." loading="lazy" decoding="async">
<img src="011.webp" width="1000" height="600" alt="Draco: Are you joking? Luna Lovegood's word against mine?" loading="lazy" decoding="async">
<img src="012.webp" width="1000" height="1325" alt="Draco: Look, I'll explain how it really works, like you were already in Slytherin. The courts use truth potion, but it's a joke: you just get yourself Obliviated before you testify. / Draco: And if I'm involved, it touches the honour of a Noble House, so it goes to the Wizengamot, where Father has the votes. Afterwards, the Lovegoods have to pay us reparations." loading="lazy" decoding="async">
<img src="013.webp" width="1000" height="775" alt="Harry: Note to self: overthrow government of magical Britain at earliest convenience." loading="lazy" decoding="async">
<img src="014.webp" width="1000" height="1150" alt="Draco: Better still, only do things the Healers can fix. Then just Obliviate her afterwards, and do it all again next week. / Draco: Though just imagine her saying she'd been done by Draco Malfoy and the Boy-Who-Lived! Not even Dumbledore would believe her." loading="lazy" decoding="async">
<img src="015.webp" width="1000" height="1075" alt="Harry: I am going to tear apart your pathetic little magical remnant of the Dark Ages into pieces smaller than its constituent atoms. / Harry: Actually, can we hold off on that? Now that I know she's a year younger than me, I had a different thought for my revenge." loading="lazy" decoding="async">
<img src="016.webp" width="1000" height="913" alt="Draco: Huh? Do tell. / Draco started to take another swig. Harry timed it exactly right:" loading="lazy" decoding="async">
<img src="017.webp" width="1000" height="700" alt="Harry: I was thinking: some day I'm going to marry that woman." loading="lazy" decoding="async">
<img src="018.webp" width="1000" height="1025" alt="Draco: Are you NUTS?" loading="lazy" decoding="async">
<img src="019.webp" width="1000" height="775" alt="Harry: Quite the opposite. I'm so sane it burns like ice." loading="lazy" decoding="async">
<img src="020.webp" width="1000" height="1125" alt="Draco: You've got weirder taste than a Lestrange. I suppose you want her all to yourself, huh? / Harry: Yep. I'll owe you a favour for it. / Draco: Nah. This one's free." loading="lazy" decoding="async">
<img src="021.webp" width="1000" height="175" alt="" loading="lazy" decoding="async">
<img src="022.webp" width="1000" height="1000" alt="Harry's face, very still, frosted over. / Charming. Happy. Generous with his favours to his friends. Draco wasn't a psychopath. That was the sad and awful part. / It didn't take an evil mutant to say what Draco had said. It was very simple, very human. To Draco, his enemies weren't people." loading="lazy" decoding="async">
<img src="023.webp" width="1000" height="1175" alt="In Harry's imagination, in freezing blue: a scroll of names headed BLOOD PURISTS, and beside it, the outline of a guillotine. / Harry: I wonder how difficult it would be to just make a list of all the top blood purists and kill them. / (They'd tried exactly that in the French Revolution, more or less. It hadn't worked out well. Maybe he should find out what went wrong, and whether it was easy to fix.)" loading="lazy" decoding="async">
<img src="024.webp" width="1000" height="175" alt="" loading="lazy" decoding="async">
<img src="025.webp" width="1000" height="900" alt="Above the station's iron arches, the pale morning Moon. / Harry: So the world is broken and flawed and insane, and cruel and bloody and dark. This is news? You always knew that, anyway… / Harry gazed up at the pale shape of the Moon, visible that morning through the cloudless air." loading="lazy" decoding="async">
<img src="026.webp" width="1000" height="1250" alt="Draco: You're looking all serious. Let me guess. Your Muggle parents told you this sort of thing was bad. / Draco: Like Father says, there may be four Houses, but in the end everyone belongs to either Slytherin or Hufflepuff. And you're not on the Hufflepuff end." loading="lazy" decoding="async">
<img src="027.webp" width="1000" height="850" alt="Draco: If you side with the Malfoys under the table… our power and your reputation… you could get away with things even I can't. Want to try it for a while?" loading="lazy" decoding="async">
<img src="028.webp" width="1000" height="900" alt="Harry: Aren't we a clever little serpent. Eleven years old and already coaxing your prey from hiding… / Harry: Draco, you want to explain the whole blood purity thing to me? I'm sort of new." loading="lazy" decoding="async">
<img src="029.webp" width="1000" height="1250" alt="A tapestry-like illustration: the four Founders' treasures shining, then a line of wizards, each generation's wand-spark dimmer than the last. / &quot;Our powers have grown weaker, generation by generation, as the Mudblood taint increases. Where Salazar and Godric and Rowena and Helga raised Hogwarts by their power, no wizard of these faded days has risen to rival them.&quot; / &quot;If the taint isn't checked, our wands will break, the line of Merlin will end, and our children will be left scratching at the dirt like the Muggles. And darkness will cover all the world for ever.&quot;" loading="lazy" decoding="async">
<img src="030.webp" width="1000" height="1000" alt="Harry: Persuasive. But I have to correct you on one point of fact. Your information about the Muggles is a bit out of date. We aren't exactly scratching at the dirt any more." loading="lazy" decoding="async">
<img src="031.webp" width="1000" height="575" alt="Draco: What? What do you mean, we?" loading="lazy" decoding="async">
<img src="032.webp" width="1000" height="1000" alt="Harry: We. The scientists. The line of Francis Bacon and the blood of the Enlightenment. / Harry: Quick check, Draco. Have wizards ever been to the Moon? You know, that thing?" loading="lazy" decoding="async">
<img src="033.webp" width="1000" height="875" alt="Draco: Go to the… it's just a… you can't Apparate to somewhere you've never been. How would anyone get to the Moon in the first place?" loading="lazy" decoding="async">
<img src="034.webp" width="1000" height="1150" alt="Harry dashes down the stairs into the cavern of his trunk, between stacked boxes of books. / Harry: Hold on, I'd like to show you a book. I think I remember which box it's in… / (Harry had inherited the nigh-magical Verres ability to remember where all his books were, which was rather mysterious considering the lack of any genetic connection.)" loading="lazy" decoding="async">
<img src="035.webp" width="1000" height="1225" alt="An open book. On the right-hand page, the photograph: astronauts on the grey lunar surface, and the Earth, blue and white, hanging in the black sky. / The one with the white, dry, cratered land, and the suited people, and the blue-white globe hanging over it all. / That picture. The picture, if only one picture in all the world were to survive." loading="lazy" decoding="async">
<img src="036.webp" width="1000" height="900" alt="Harry: That… is what the Earth looks like from the Moon. / His voice trembled. He couldn't quite keep the pride out." loading="lazy" decoding="async">
<img src="037.webp" width="1000" height="900" alt="Draco: If that's a real picture… why isn't it moving? / Draco: And what are those?" loading="lazy" decoding="async">
<img src="038.webp" width="1000" height="850" alt="Harry: Those are human beings. Wearing suits that give them air, because there is no air on the Moon." loading="lazy" decoding="async">
<img src="039.webp" width="1000" height="750" alt="Draco: That's impossible. No Muggle could ever do that. How…" loading="lazy" decoding="async">
<img src="040.webp" width="1000" height="1175" alt="Harry: This is a rocket going up. The fire pushes it higher, until it gets to the Moon. / Harry: That tiny speck next to it is a person." loading="lazy" decoding="async">
<img src="041.webp" width="1000" height="1100" alt="Harry: Going to the Moon cost probably around a thousand million Galleons. And it took more people than live in all of magical Britain. / Harry: And when they arrived, they left a plaque that said: &quot;We came in peace, for all mankind.&quot; Though you're not yet ready to hear those words, Draco Malfoy…" loading="lazy" decoding="async">
<img src="042.webp" width="1000" height="1025" alt="Draco: You're telling the truth. You wouldn't fake a whole book just for this. I can hear it in your voice. / Draco: But… if Muggles have that kind of power… then what are we?" loading="lazy" decoding="async">
<img src="043.webp" width="1000" height="938" alt="Harry: No, Draco, that's not it. Science taps the power of human understanding. You look at the world and figure out how it works. It's not a Muggle thing. It's a human thing." loading="lazy" decoding="async">
<img src="044.webp" width="1000" height="1075" alt="Harry: Your magic could turn off, and you would hate that. But science is the power that can't be taken from me without taking me. It just trains the power you use every time you look at something you don't understand and ask, &quot;Why?&quot;" loading="lazy" decoding="async">
<img src="045.webp" width="1000" height="700" alt="Harry: You're of Slytherin, Draco. Don't you see the implication?" loading="lazy" decoding="async">
<img src="046.webp" width="1000" height="700" alt="Draco: Wizards can learn to use this power." loading="lazy" decoding="async">
<img src="047.webp" width="1000" height="1000" alt="Harry: Very carefully, now… the bait is set; now the hook… / Harry: If you can learn to think of yourself as a human instead of a wizard, then you can train your powers as a human." loading="lazy" decoding="async">
<img src="048.webp" width="1000" height="850" alt="Draco: You think you can master both arts. Add the powers together, and… make yourself Lord of the two worlds?" loading="lazy" decoding="async">
<img src="049.webp" width="1000" height="1250" alt="Harry gives an evil laugh, which just seemed to come naturally at that point. / Harry: MWAHAHAHA! / Harry: The whole world you know is one square on a much larger game board, Draco. But I really am Ravenclaw. I don't want to rule the universe. I just think it could be more sensibly organised." loading="lazy" decoding="async">
<img src="050.webp" width="1000" height="575" alt="Draco: Why are you telling me this?" loading="lazy" decoding="async">
<img src="051.webp" width="1000" height="1075" alt="Harry: There aren't many people who know how to do true science. Help would be helpful. / Harry: But science isn't like learning a spell. The power comes with a cost. A cost so high that most people refuse to pay it." loading="lazy" decoding="async">
<img src="052.webp" width="1000" height="575" alt="Draco: And that cost?" loading="lazy" decoding="async">
<img src="053.webp" width="1000" height="525" alt="Learning to admit you're wrong. / Harry: Learning to admit you're wrong." loading="lazy" decoding="async">
<img src="054.webp" width="1000" height="575" alt="Draco: Um. You going to explain that?" loading="lazy" decoding="async">
<img src="055.webp" width="1000" height="1050" alt="Harry: Trying to figure out how something works, the first ninety-nine explanations you come up with are wrong. So you have to admit you're wrong, over and over and over again. And every time you change your mind, you change yourself." loading="lazy" decoding="async">
<img src="056.webp" width="1000" height="900" alt="Harry: There's one condition. I'm dealing with you, Draco. Not your father. Your moves in our game have to be your own." loading="lazy" decoding="async">
<img src="057.webp" width="1000" height="775" alt="Draco: I've got to go. I've got to go off and think about this. / Harry: Take your time." loading="lazy" decoding="async">
<img src="058.webp" width="1000" height="800" alt="The sounds of the platform came back as Draco wandered off. Harry slowly exhaled a breath he hadn't realised he'd been holding." loading="lazy" decoding="async">
<img src="059.webp" width="1000" height="1025" alt="Two tall figures with scarves wound over their heads like shrouds, only their eyes glinting through. / When Harry looked up, two figures were approaching. They looked utterly ridiculous, their faces cloaked by winter scarves. / Fred: Hello, Mr Bronze. Can we interest you in joining the Order of Chaos?" loading="lazy" decoding="async">
<img src="060.webp" width="1000" height="950" alt="A small, round-faced boy stands alone and very frightened. / Meanwhile, not far away, a small, round boy had been left alone for a moment on the platform. He looked sure he was about to be attacked by Death Eaters. / (There's a saying: the fear is often worse than the thing itself.)" loading="lazy" decoding="async">
<img src="061.webp" width="1000" height="1250" alt="Three shrouded figures cavort around the terrified boy, laughing evilly, and showering him with chocolate and coins. / Fred: Have some Knuts, boy! / George: Have a silver Sickle!" loading="lazy" decoding="async">
<img src="062.webp" width="1000" height="700" alt="Neville: go away" loading="lazy" decoding="async">
<img src="063.webp" width="1000" height="1000" alt="Harry: AAAH! THE LIGHT! IT BURNS! / Some of the crowd had wanted to interfere at first. Then they saw what was actually happening, and were too confused to do anything." loading="lazy" decoding="async">
<img src="064.webp" width="1000" height="775" alt="Harry, very pleased with himself. / Harry: Hopefully, he wouldn't be as scared of being bullied in the future. That's called desensitisation therapy. / Harry: It was definitely for his own good." loading="lazy" decoding="async">
<img src="065.webp" width="1000" height="475" alt="Wasn't it? / Wasn't it?" loading="lazy" decoding="async">
<img src="066.webp" width="1000" height="200" alt="AFTERMATH" loading="lazy" decoding="async">
<img src="067.webp" width="1000" height="900" alt="Draco alone at a desk in a green-hung stone room by a fire, quill in hand. / That night, after all the day's fuss had subsided. A private room in the Slytherin dungeons. You had to be the very best of the House to have one." loading="lazy" decoding="async">
<img src="068.webp" width="1000" height="775" alt="&quot;Dear Father,&quot; and a spreading blot of ink. / And then he stopped. Ink slowly dripped from his quill, staining the parchment near the words." loading="lazy" decoding="async">
<img src="069.webp" width="1000" height="1025" alt="Draco: Potter was brilliant, and a whole lot more than slightly mad, playing a vast game he mostly didn't understand, with the subtlety of a rampaging nundu. / Draco: But he had offered me the chance to play. And if I blurted the whole thing out, it would become Father's." loading="lazy" decoding="async">
<img src="070.webp" width="1000" height="700" alt="So now, for the first time in his life, he had real secrets to keep." loading="lazy" decoding="async">
<img src="071.webp" width="1000" height="750" alt="Draco's letter: &quot;Dear Father, suppose I told you I met a student, not already of our acquaintance, who called you a 'flawless instrument of death' and said that I was your 'one weak point'. What would you say about him?&quot;" loading="lazy" decoding="async">
<img src="072.webp" width="1000" height="700" alt="A black owl swoops in with a sealed letter. / It didn't take long for the family owl to bring the reply." loading="lazy" decoding="async">
<img src="073.webp" width="1000" height="725" alt="Lucius's reply: &quot;My beloved son, I would say that you had been so fortunate as to meet someone who enjoys the intimate confidence of our friend and valuable ally, Severus Snape.&quot;" loading="lazy" decoding="async">
<img src="074.webp" width="1000" height="775" alt="The letter curls in the flames. / Draco stared at the letter for a while. Then he threw it into the fire." loading="lazy" decoding="async">
