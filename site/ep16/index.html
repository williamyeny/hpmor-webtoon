<img src="005.webp" width="1000" height="1250" alt="Harry thinks of the bullies, of Draco, and lets the cold rise. Frost at the edges. He says the spell in icy tones. / He had read a great many fantasy novels. And it was starting to look like he had a mysterious dark side. So he glanced around to make sure no-one was watching, took a deep breath, and made himself angry. / Harry: Frigideiro." loading="lazy" decoding="async">
<img src="006.webp" width="1000" height="775" alt="Absolutely nothing happened." loading="lazy" decoding="async">
<img src="007.webp" width="1000" height="1075" alt="Harry: He had been swindled. He wanted to write to someone and demand a refund on his dark side, which clearly ought to have come with irresistible magical power, and had turned out to be defective." loading="lazy" decoding="async">
<img src="008.webp" width="1000" height="1250" alt="Hermione: Frigideiro! / Hermione's water was solid ice, with white crystals forming on the rim of the glass. She seemed totally intent on her own work, and not at all conscious of the other students staring at her with hateful eyes." loading="lazy" decoding="async">
<img src="009.webp" width="1000" height="1100" alt="Flitwick: Oh, very good, Miss Granger! Excellent! Stupendous!" loading="lazy" decoding="async">
<img src="010.webp" width="1000" height="1025" alt="It was the obvious role for her in the scheme of things. Harry swallowed hard. / Harry: Hermione? Do you have any idea what I might be doing wrong?" loading="lazy" decoding="async">
<img src="011.webp" width="1000" height="1075" alt="Hermione beams straight out of the page, eyes alight with helpfulness. / Hermione's eyes lit up with a terrible light of helpfulness. And something in the back of Harry's brain screamed in desperate humiliation." loading="lazy" decoding="async">
<img src="012.webp" width="1000" height="1125" alt="Harry's water is noticeably cooler. Hermione pats him on the head, verbally, and moves on to help someone else. / Five minutes later… / Hermione: Much better! Just pronounce it more carefully next time. / Flitwick: A point to Miss Granger, for helping!" loading="lazy" decoding="async">
<img src="013.webp" width="1000" height="1450" alt="Harry, jaw clenched. Under his robes, a glint of the hourglass necklace. / Harry was gritting his teeth so hard his jaw ached. That wasn't helping his pronunciation. / Harry: I don't care if it's unfair competition. I know exactly what I am doing with two extra hours every day. I am going to sit in my trunk and study until I am keeping up with Hermione Granger." loading="lazy" decoding="async">
<img src="014.webp" width="1000" height="250" alt="Transfiguration." loading="lazy" decoding="async">
<img src="015.webp" width="1000" height="1150" alt="The Transfiguration classroom: stern, tidy, a polished wooden board, a tartan hanging. There is no trace of levity on the witch's face. / McGonagall: Transfiguration is some of the most complex and dangerous magic you will learn at Hogwarts. Anyone messing around in my class will leave and not come back. / McGonagall: You have been warned." loading="lazy" decoding="async">
<img src="016.webp" width="1000" height="875" alt="McGonagall taps her desk with her wand; it becomes a confused pig. Then a desk again. / Tap. / Her desk became a pig." loading="lazy" decoding="async">
<img src="017.webp" width="1000" height="1125" alt="McGonagall points at the confused pig. / McGonagall: Mr Potter. Would you care to guess whether this is a desk which I Transfigured into a pig, or whether it began as a pig? If you had read the first chapter of your textbook, you would know." loading="lazy" decoding="async">
<img src="018.webp" width="1000" height="800" alt="Harry: I'd guess it'd be easier to start with a pig, since if it started as a desk, it might not know how to stand up." loading="lazy" decoding="async">
<img src="019.webp" width="1000" height="950" alt="McGonagall: No fault to you, Mr Potter. But the correct answer is that in Transfiguration, you do not care to guess." loading="lazy" decoding="async">
<img src="020.webp" width="1000" height="1250" alt="McGonagall lays down the law to the class. / McGonagall: Wrong answers will be marked with extreme severity. Questions left blank, with great leniency. If I ask you anything, no matter how elementary, and you answer &quot;I'm not sure&quot;, I will not hold it against you. And anyone who laughs will lose House points." loading="lazy" decoding="async">
<img src="021.webp" width="1000" height="1125" alt="McGonagall: Can you tell me why this rule exists, Mr Potter? / Harry: Because a single error in Transfiguration can be incredibly dangerous. / Harry: No." loading="lazy" decoding="async">
<img src="022.webp" width="1000" height="700" alt="McGonagall: Correct." loading="lazy" decoding="async">
<img src="023.webp" width="1000" height="1200" alt="On the board, in red, underlined in blue: Transfiguration is not permanent! / McGonagall: Transfiguration is not permanent! / McGonagall: Transfiguration is not permanent! / McGonagall: Transfiguration is not permanent!" loading="lazy" decoding="async">
<img src="024.webp" width="1000" height="1075" alt="McGonagall: Mr Potter, suppose a student Transfigured a block of wood into a cup of water, and you drank it. What do you imagine might happen to you when the Transfiguration wore off?" loading="lazy" decoding="async">
<img src="025.webp" width="1000" height="650" alt="McGonagall: …Excuse me, I should not have asked that of you. I forgot you are blessed with an unusually pessimistic imagination—" loading="lazy" decoding="async">
<img src="026.webp" width="1000" height="1250" alt="Harry, gone a little pale. / Harry: I'm fine. So the first answer is that I don't know. But I imagine there might be… wood. In my stomach. And in my bloodstream. And if any of that water had been absorbed into my body's tissues… / His grasp of magic failed him. He couldn't understand how wood mapped into water in the first place." loading="lazy" decoding="async">
<img src="027.webp" width="1000" height="1175" alt="McGonagall: As Mr Potter has correctly reasoned, he would become extremely sick, and require immediate Flooing to St Mungo's if he was to have any chance of survival. / McGonagall: Please turn your textbooks to page five." loading="lazy" decoding="async">
<img src="028.webp" width="1000" height="800" alt="A textbook page with a moving picture of a poisoned woman, screaming. / Even without any sound in the moving picture, you could tell the woman with the discoloured skin was screaming." loading="lazy" decoding="async">
<img src="029.webp" width="1000" height="925" alt="Harry and Hermione stare at the page in horror. / McGonagall: The criminal who Transfigured gold into wine and gave it to this woman to drink, &quot;in payment of the debt&quot;, received ten years in Azkaban." loading="lazy" decoding="async">
<img src="030.webp" width="1000" height="1325" alt="Page six: a tall, hooded, cold shape. A Dementor. / McGonagall: Page six. That is a Dementor. They are the guardians of Azkaban. They suck away at your magic, your life, and any happy thoughts you try to have. / McGonagall: The picture on page seven is of the criminal, ten years later, on his release. You will note that he is dead." loading="lazy" decoding="async">
<img src="031.webp" width="1000" height="875" alt="Harry: Professor, if the worst happens in a case like that, is there any way of maintaining the Transfiguration?" loading="lazy" decoding="async">
<img src="032.webp" width="1000" height="975" alt="McGonagall: No. Sustaining a Transfiguration is a constant drain on your magic, and you would need to re-contact the target every few hours. Disasters like this are unrecoverable!" loading="lazy" decoding="async">
<img src="033.webp" width="1000" height="1250" alt="McGonagall leans forward, her face very hard. / McGonagall: You will absolutely never, under any circumstances, Transfigure anything into a liquid or a gas. No water, no air. Nothing like water, nothing like air. You will not Transfigure anything that is to be burned. It will make smoke, and someone could breathe it." loading="lazy" decoding="async">
<img src="034.webp" width="1000" height="1125" alt="McGonagall looms over the front row. / McGonagall: You will never Transfigure anything that could conceivably go inside anyone's body. No food. Nothing that looks like food. Not even as a funny little prank. Is that well understood by every single student?" loading="lazy" decoding="async">
<img src="035.webp" width="1000" height="800" alt="Harry: Yes. / Hermione: Yes! / Said Harry, Hermione, and a few others. The rest seemed to be speechless." loading="lazy" decoding="async">
<img src="036.webp" width="1000" height="1200" alt="McGonagall: IS THAT WELL UNDERSTOOD BY EVERY SINGLE STUDENT?" loading="lazy" decoding="async">
<img src="037.webp" width="1000" height="875" alt="The whole class chanting the rules. / &quot;Yes,&quot; they said, or muttered, or whispered. Then they repeated the rules along with her, in ragged chorus: / I will never Transfigure anything into a liquid or gas. / I will never Transfigure anything that looks like food, or anything else that goes inside a human body." loading="lazy" decoding="async">
<img src="038.webp" width="1000" height="850" alt="Louder now. / I will never Transfigure anything that is to be burned, because it could make smoke. / I will never Transfigure anything that looks like money." loading="lazy" decoding="async">
<img src="039.webp" width="1000" height="950" alt="McGonagall: Including Muggle money. The goblins have ways of finding out who did it. As a matter of recognised law, the goblin nation is in a permanent state of war with all magical counterfeiters." loading="lazy" decoding="async">
<img src="040.webp" width="1000" height="650" alt="McGonagall: They will not send Aurors. They will send an army." loading="lazy" decoding="async">
<img src="041.webp" width="1000" height="875" alt="McGonagall: And above all, you will not Transfigure any living subject. Especially yourselves." loading="lazy" decoding="async">
<img src="042.webp" width="1000" height="875" alt="Harry, hand up. / McGonagall: Mr Potter is currently holding up his hand, because he has seen an Animagus transformation. But an Animagus transformation is not free Transfiguration." loading="lazy" decoding="async">
<img src="043.webp" width="1000" height="433" alt="A chunk of wood becomes a glass ball, then (Crystferrium!) a steel ball, then wood again. / wood / glass / Crystferrium! steel / wood again" loading="lazy" decoding="async">
<img src="044.webp" width="1000" height="1000" alt="McGonagall: Free Transfiguration can turn any subject into any target. It must be done wordlessly: by holding the subject, the target, and the transformation, within your own mind." loading="lazy" decoding="async">
<img src="045.webp" width="1000" height="1025" alt="McGonagall: If you press your wand to your body and imagine yourself with golden hair, afterwards your hair will fall out. And if you Transfigure yourself into an adult body, then, when the Transfiguration wears off, you will die." loading="lazy" decoding="async">
<img src="046.webp" width="1000" height="1250" alt="Harry: That explained why there were still fat boys, and girls who weren't perfectly pretty, and old people. That wouldn't happen if you could just Transfigure yourself every morning… / Harry: Is it possible to Transfigure a living subject into something static, such as a coin—no, excuse me, I'm terribly sorry, let's just say a steel ball." loading="lazy" decoding="async">
<img src="047.webp" width="1000" height="875" alt="McGonagall: Mr Potter, even inanimate objects undergo small internal changes over time. For the first minute, you would notice nothing wrong." loading="lazy" decoding="async">
<img src="048.webp" width="1000" height="600" alt="McGonagall: But in an hour you would be sick. And in a day you would be dead." loading="lazy" decoding="async">
<img src="049.webp" width="1000" height="900" alt="The class chants the last rules. / They repeated the last of the rules: / If I am not sure whether a Transfiguration is safe, I will not try it until I have asked Professor McGonagall or Professor Flitwick or Professor Snape or the Headmaster." loading="lazy" decoding="async">
<img src="050.webp" width="1000" height="875" alt="Harry and Hermione chant the rule about the Defence Professor. / Even if the current Defence Professor tells me that a Transfiguration is safe, and even if I see the Defence Professor do it and nothing bad seems to happen, I will not try it myself." loading="lazy" decoding="async">
<img src="051.webp" width="1000" height="900" alt="The class, chanting the right to refuse. / I have the absolute right to refuse to perform any Transfiguration about which I feel the slightest bit nervous. And I certainly will not accept any such order from the Defence Professor, even if the Defence Professor threatens to deduct one hundred House points and have me expelled." loading="lazy" decoding="async">
<img src="052.webp" width="1000" height="875" alt="McGonagall: We will repeat these rules at the start of every class for the first month. And now, we will begin with matches as subjects, and needles as targets." loading="lazy" decoding="async">
<img src="053.webp" width="1000" height="750" alt="The whole class, wands raised, eager. / McGonagall: …Put away your wands, thank you. By &quot;begin&quot;, I meant that you will begin taking notes." loading="lazy" decoding="async">
<img src="054.webp" width="1000" height="875" alt="At the end of the class, Hermione had a silvery-looking match. The entire rest of the class, Muggle-born or otherwise, had exactly what they'd started with. / McGonagall: A point to Ravenclaw." loading="lazy" decoding="async">
<img src="055.webp" width="1000" height="1075" alt="Hermione, all innocence, at Harry's desk. / Hermione: You know, I earned two points for Ravenclaw today. / Harry: So you did. / Hermione: But that wasn't as good as your seven points. I guess I'm just not as intelligent as you." loading="lazy" decoding="async">
<img src="056.webp" width="1000" height="775" alt="She batted her eyelashes at him." loading="lazy" decoding="async">
<img src="057.webp" width="1000" height="1075" alt="Hermione: We have lessons every day, though. I wonder how long it will take you to find some more Hufflepuffs to rescue? / Hermione: Today is Monday. So that gives you until Thursday." loading="lazy" decoding="async">
<img src="058.webp" width="1000" height="800" alt="Eye to eye. / The two of them stared into each other's eyes, unblinking." loading="lazy" decoding="async">
<img src="059.webp" width="1000" height="1075" alt="Harry and Hermione, eye to eye, a diagonal line between them. / Harry: Of course you realise this means war. / Hermione: I didn't know we'd been at peace." loading="lazy" decoding="async">
<img src="060.webp" width="1000" height="1050" alt="All of the other students were now watching with fascinated eyes. All of the other students, plus, unfortunately, Professor McGonagall." loading="lazy" decoding="async">
<img src="061.webp" width="1000" height="925" alt="McGonagall, practically singing. / McGonagall: Oh, Mr Potter, I have some good news for you! Madam Pomfrey has approved your suggestion for preventing breakage in her Spimster wickets." loading="lazy" decoding="async">
<img src="062.webp" width="1000" height="600" alt="McGonagall: I'd say that deserves… let's call it ten points for Ravenclaw." loading="lazy" decoding="async">
<img src="063.webp" width="1000" height="775" alt="Two faces of betrayal. / Hermione's face gaped in betrayal and shock. Harry imagined his own didn't look much different." loading="lazy" decoding="async">
<img src="064.webp" width="1000" height="575" alt="Harry: Professor…" loading="lazy" decoding="async">
<img src="065.webp" width="1000" height="1125" alt="McGonagall: Those ten points are unquestionably deserved, Mr Potter. My, I wonder if any other student has ever earned seventeen House points on his first day of lessons? I'll have to look it up. Perhaps we should have an announcement at dinner?" loading="lazy" decoding="async">
<img src="066.webp" width="1000" height="950" alt="Harry: PROFESSOR! This is our war! Stop meddling!" loading="lazy" decoding="async">
<img src="067.webp" width="1000" height="950" alt="McGonagall, hands on her hips, looking reflective. / McGonagall: Now you have until Thursday of next week, Mr Potter. Unless, of course, you engage in some sort of mischief and lose House points before then. Addressing a professor disrespectfully, for example." loading="lazy" decoding="async">
<img src="068.webp" width="1000" height="575" alt="McGonagall: I expect you'll hit negative numbers before the end of Friday." loading="lazy" decoding="async">
<img src="069.webp" width="1000" height="775" alt="Harry's mouth snapped shut. He sent his best Death Glare. She only seemed to find it amusing." loading="lazy" decoding="async">
<img src="070.webp" width="1000" height="950" alt="McGonagall: …and if anyone comes to you for help with their schoolwork, and is disappointed that you haven't even started reading your textbooks, you can always refer them to Miss Granger." loading="lazy" decoding="async">
<img src="071.webp" width="1000" height="700" alt="Hermione: Professor!" loading="lazy" decoding="async">
<img src="072.webp" width="1000" height="750" alt="McGonagall: My, I wonder how long it will take before Miss Granger does something deserving of a dinner-time announcement? I look forward to seeing it." loading="lazy" decoding="async">
<img src="073.webp" width="1000" height="800" alt="Harry and Hermione storm down the corridor side by side; a line of Ravenclaws trails behind, entranced. / Harry and Hermione, by unspoken mutual consent, turned and stormed out of the classroom. They were followed by a trail of hypnotised Ravenclaws." loading="lazy" decoding="async">
<img src="074.webp" width="1000" height="1300" alt="Harry: Um. Are we still on for after dinner? / Hermione: Of course. I wouldn't want you to fall further behind on your studying. / Harry: Why, thank you. And as brilliant as you are already, I can't help but wonder what you'll be like once you have some elementary training in rationality." loading="lazy" decoding="async">
