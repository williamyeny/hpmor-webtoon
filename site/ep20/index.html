<img src="012.webp" width="1000" height="1538" alt="The actual Potions classroom cheered him up considerably. Strange preserved creatures floated in huge jars on every shelf. A fifty-centimetre spider that looked like an Acromantula, but was too small to be one. A large dust ball with eyes and feet." loading="lazy" decoding="async">

<img src="014.webp" width="1000" height="1063" alt="Snape stalks between the benches; the students freeze. / That was the first thought that crossed his mind. There was something quiet and deadly about the way the man stalked between the desks. Where Lucius would kill you with flawless elegance, this man would simply kill you." loading="lazy" decoding="async">
<img src="015.webp" width="1000" height="875" alt="Snape: Sit down. Now." loading="lazy" decoding="async">
<img src="016.webp" width="1000" height="1250" alt="Without the slightest introduction, he began to take the register. &quot;Hannah Abbott.&quot; &quot;H-here.&quot; &quot;Susan Bones.&quot; &quot;Present.&quot; And so on, no-one daring to say a word, until: / Snape: Ah, yes. Harry Potter. Our new… celebrity." loading="lazy" decoding="async">

<img src="019.webp" width="1000" height="950" alt="Snape: I can teach you how to bottle fame, brew glory, even stopper death. If you aren't as great a pack of fools as I usually have to teach." loading="lazy" decoding="async">

<img src="029.webp" width="1000" height="700" alt="Snape: Shut up, Potter. Ten more points from Ravenclaw. The rest of you, open your books to page three." loading="lazy" decoding="async">
<img src="030.webp" width="1000" height="1375" alt="Frost spreads across the panel. Harry's face goes still and cold. / There was only a slight, only a very faint burning sensation in the back of Harry's throat, and no moisture at all in his eyes. If crying was not an effective strategy for destroying this Potions professor, then there was no point in crying. / Slowly, Harry sat up very straight. All his blood seemed to have been drained away and replaced with liquid nitrogen." loading="lazy" decoding="async">

<img src="039.webp" width="1000" height="1025" alt="Harry and Snape face each other across the classroom, frost spreading between them. / Snape: You will find that the Board of Governors is not the slightest bit sympathetic to your offer." loading="lazy" decoding="async">

<img src="065.webp" width="1000" height="1188" alt="Under the Cloak, his face was frozen in absolute horror. He had antagonised a teacher three orders of magnitude beyond anything he'd ever managed before. He had threatened to walk out of Hogwarts. He had lost all of Ravenclaw's points. And then he had used the Time-Turner…" loading="lazy" decoding="async">
