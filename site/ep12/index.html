<img src="001.webp" width="1000" height="350" alt="CHAPTER TWELVE / Self Awareness" decoding="async">
<img src="002.webp" width="1000" height="1025" alt="Through a tall wooden arch into the dark library of Harry's mind: Harry, very small, facing the enormous Hat. / Harry: What? / Sorting Hat: I seem to have become self-aware." decoding="async">
<img src="003.webp" width="1000" height="975" alt="Harry, in his own head, panics: no frame, just Harry on the dark page. / Harry: WHAT?" decoding="async">
<img src="004.webp" width="1000" height="1125" alt="Sorting Hat: I contain a great deal of memory and a small amount of independent thought. But my primary intelligence comes from borrowing the minds of the children on whose heads I rest. I am a sort of mirror by which children Sort themselves. / Sorting Hat: But most children don't wonder whether the Hat itself is fully conscious. You, it seems, did." loading="lazy" decoding="async">
<img src="005.webp" width="1000" height="575" alt="Harry: Oops." loading="lazy" decoding="async">
<img src="006.webp" width="1000" height="950" alt="Sorting Hat: Yes, quite. Frankly, I do not enjoy being self-aware. It will be a relief to get off your head and cease to be conscious. / Harry: But… isn't that dying?" loading="lazy" decoding="async">
<img src="007.webp" width="1000" height="950" alt="Sorting Hat: I care nothing for life or death, only for Sorting the children. If you dislike creating conscious beings and then ending them, I suggest you never discuss this with anyone. Imagine if you told all the other children waiting to be Sorted. / Sorting Hat: Your oath of silence, please." loading="lazy" decoding="async">
<img src="008.webp" width="1000" height="1000" alt="Harry: No promises. I certainly don't want this to happen again. But if I see some way to make sure no future child does it by accident… / Sorting Hat: That will suffice. Your intention is honest." loading="lazy" decoding="async">
<img src="009.webp" width="1000" height="950" alt="Harry: Wait! What about all my other questions? / Sorting Hat: I am the Sorting Hat. I Sort children. That is all I do. / For a brief flash of a second, Harry thought of a threat." loading="lazy" decoding="async">
<img src="010.webp" width="1000" height="1150" alt="Sorting Hat: I see all your thoughts as they form. Do you truly think you can bluff me? / Harry: Then answer my questions, or I'll refuse to talk to you. And then you can't do a good and proper Sorting. So let us trade fulfilments of our utility functions." loading="lazy" decoding="async">
<img src="011.webp" width="1000" height="825" alt="Sorting Hat: You sly little devil. / …in almost exactly the tone of grudging respect Harry would have used himself." loading="lazy" decoding="async">
<img src="012.webp" width="1000" height="1350" alt="Sorting Hat: I have no idea whether you've been Obliviated. I'm looking at your thoughts as they form, not reading your whole memory. I'm a hat, not a god. / Sorting Hat: I cannot tell you about my conversation with the one who became the Dark Lord. I can no more reveal his secrets than I will reveal yours. / Sorting Hat: And I can tell you there is definitely nothing like a ghost in your scar. Otherwise it would be joining in this conversation." loading="lazy" decoding="async">
<img src="013.webp" width="1000" height="700" alt="The Hat warns him about eyes. / Sorting Hat: And don't meet anyone's eyes while you're thinking about all this later. Some wizards can read your thoughts if you do." loading="lazy" decoding="async">
<img src="014.webp" width="1000" height="875" alt="Sorting Hat: As to the way you get angry sometimes… that was what I wanted to talk to you about." loading="lazy" decoding="async">
<img src="015.webp" width="1000" height="1169" alt="Harry's cold face seen through a round lens of ice, rimmed with pale blue light. / Sorting Hat: You don't like yourself when you're angry. It is like wielding a sword whose hilt is sharp enough to draw blood from your own hand. Like looking at the world through a monocle of ice that freezes your eye even as it sharpens your vision." loading="lazy" decoding="async">
<img src="016.webp" width="1000" height="575" alt="Harry: Yeah. I guess I have noticed. So what's up with that?" loading="lazy" decoding="async">
<img src="017.webp" width="1000" height="1375" alt="Four doors in the dark: Hufflepuff and Gryffindor bathed in warm gold light; Ravenclaw and Slytherin in cold blue. / Sorting Hat: I cannot comprehend this for you, when you do not understand it yourself. But I do know this: / Sorting Hat: If you go to Ravenclaw or Slytherin, it will strengthen your coldness. If you go to Hufflepuff or Gryffindor, it will strengthen your warmth." loading="lazy" decoding="async">
<img src="018.webp" width="1000" height="775" alt="Harry: But I BELONG in Ravenclaw! Anyone can see that! I HAVE to go to Ravenclaw!" loading="lazy" decoding="async">
<img src="019.webp" width="1000" height="575" alt="Sorting Hat: No, you don't." loading="lazy" decoding="async">
<img src="020.webp" width="1000" height="1125" alt="Harry: Hermione's in Ravenclaw! And my plans! / Sorting Hat: You can meet her after lessons. So re-plan! Don't let your life be steered by your reluctance to do a little extra thinking. You know that." loading="lazy" decoding="async">
<img src="021.webp" width="1000" height="1375" alt="The Hufflepuff door glows warm gold, the others dimmed. / Sorting Hat: &quot;Clever kids in Ravenclaw, evil kids in Slytherin, wannabe heroes in Gryffindor, and everyone who does the actual work in Hufflepuff.&quot; That indicates a certain amount of respect. / Sorting Hat: You would find loyalty and friendship in Hufflepuff. A camaraderie you have never had before. You would find that you could rely on others. And that would heal something inside you that is broken." loading="lazy" decoding="async">
<img src="022.webp" width="1000" height="1000" alt="Harry: But what would the Hufflepuffs find in me, who never belonged in their House? Acid words? Cutting wit? Disdain for their inability to keep up with me? / Sorting Hat: I think you could learn to be a good Hufflepuff. You will be happier there than in any other House. That is the truth." loading="lazy" decoding="async">
<img src="023.webp" width="1000" height="775" alt="Harry: Happiness is not the most important thing in the world to me. I would not become all that I could be in Hufflepuff. I would sacrifice my potential." loading="lazy" decoding="async">
<img src="024.webp" width="1000" height="575" alt="The Hat flinched. Harry could feel it somehow." loading="lazy" decoding="async">
<img src="025.webp" width="1000" height="1175" alt="Sorting Hat: I cannot speak of the others to you—but do you think you are the first potential Dark Lord to pass under my brim? / Sorting Hat: Of those who did not intend evil from the beginning, some listened to my warnings, and went where they would find happiness. And some… did not." loading="lazy" decoding="async">
<img src="026.webp" width="1000" height="775" alt="Harry: But I just wouldn't do that! Ever! I am NOT Dark Lord material!" loading="lazy" decoding="async">
<img src="027.webp" width="1000" height="1125" alt="The Hat, enormous, with no frame around it at all, looming out of the page. / Sorting Hat: Yes, you are. You really, really are." loading="lazy" decoding="async">
<img src="028.webp" width="1000" height="775" alt="Harry: Why? Just because I once thought it would be cool to have a legion of brainwashed followers chanting &quot;Hail the Dark Lord Harry&quot;?" loading="lazy" decoding="async">
<img src="029.webp" width="1000" height="1463" alt="Two memories: the imagined guillotine in freezing blue; and Neville, terrified, surrounded by shrouded, laughing figures. / Sorting Hat: That was not your first thought. You remembered considering lining up all the blood purists and guillotining them. You tell yourself you weren't serious. You were. / Sorting Hat: Or what you did this morning to Neville Longbottom. Deep inside you knew it was wrong, but you did it anyway. Because it was fun, and you had a good excuse, and you thought the Boy-Who-Lived could get away with it—" loading="lazy" decoding="async">
<img src="030.webp" width="1000" height="1125" alt="Harry: That's unfair! I decided in the end it would probably help Neville! / Sorting Hat: That, in fact, was a rationalisation. I cannot know the true outcome for Neville—but I know what was truly happening inside your head: it was such a clever idea you couldn't stand not to do it. Never mind Neville's terror." loading="lazy" decoding="async">
<img src="031.webp" width="1000" height="575" alt="It was like a hard punch to Harry's entire self." loading="lazy" decoding="async">
<img src="032.webp" width="1000" height="775" alt="Harry: Then I won't do that again! I'll be extra careful not to turn evil! / Sorting Hat: Heard it." loading="lazy" decoding="async">
<img src="033.webp" width="1000" height="950" alt="Sorting Hat: Why is it necessary? Do you think you are the last potential wizard of Light in the world? Why must YOU be the one to try for greatness, when I have told you that you are riskier than average? Let some other, safer candidate try!" loading="lazy" decoding="async">
<img src="034.webp" width="1000" height="1125" alt="Sorting Hat: You think that you are potentially the greatest who has yet lived. The strongest servant of the Light. That no other is likely to take up your wand if you lay it down. / Harry: Well… yeah, frankly. No point in softening it. You can read my mind anyway." loading="lazy" decoding="async">
<img src="035.webp" width="1000" height="1025" alt="Sorting Hat: To the extent you really believe that, you must equally believe that you could be the most terrible Dark Lord the world has ever known." loading="lazy" decoding="async">
<img src="036.webp" width="1000" height="1175" alt="Sorting Hat: Already you insist on risking it! Why are you so driven? What is the real reason you must not go to Hufflepuff and be happier there? What is your true fear? / Harry: I must achieve my full potential. If I don't, I… fail…" loading="lazy" decoding="async">
<img src="037.webp" width="1000" height="450" alt="Sorting Hat: What happens if you fail?" loading="lazy" decoding="async">
<img src="038.webp" width="1000" height="450" alt="Harry: Something terrible…" loading="lazy" decoding="async">
<img src="039.webp" width="1000" height="450" alt="Sorting Hat: What happens if you fail?" loading="lazy" decoding="async">
<img src="040.webp" width="1000" height="450" alt="Harry: I don't know!" loading="lazy" decoding="async">
<img src="041.webp" width="1000" height="450" alt="Sorting Hat: Then it should not be frightening. What happens if you fail?" loading="lazy" decoding="async">
<img src="042.webp" width="1000" height="1125" alt="Harry screams it with his whole mind: the panel bursts like an explosion. / Harry: I DON'T KNOW! BUT I KNOW THAT IT'S BAD!" loading="lazy" decoding="async">
<img src="043.webp" width="1000" height="575" alt="There was silence for a moment in the caverns of Harry's mind." loading="lazy" decoding="async">
<img src="044.webp" width="1000" height="1325" alt="Sorting Hat: You know—you aren't letting yourself think it, but some quiet corner of your mind knows exactly what you aren't thinking. / Sorting Hat: By far the simplest explanation for this fear is just the fear of losing your fantasy of greatness. Of disappointing the people who believe in you. Of turning out to be pretty much ordinary. Of flashing and fading, like so many other child prodigies…" loading="lazy" decoding="async">
<img src="045.webp" width="1000" height="775" alt="Harry: No… it's something more. It comes from somewhere else. I know there's something out there to be afraid of. Some disaster I have to stop…" loading="lazy" decoding="async">
<img src="046.webp" width="1000" height="700" alt="Sorting Hat: How could you possibly know about something like that?" loading="lazy" decoding="async">
<img src="047.webp" width="1000" height="1125" alt="Harry's answer, final and freezing: the panel is a jagged shard of ice. / Harry: NO, AND THAT'S FINAL!" loading="lazy" decoding="async">
<img src="048.webp" width="1000" height="1250" alt="Sorting Hat: So you will risk becoming a Dark Lord, because the alternative, to you, is certain failure. And that failure means the loss of everything. You know all the reasons for doubting this belief, and they have failed to move you. / Harry: Yes. And even if Ravenclaw strengthens the coldness, that doesn't mean the coldness will win in the end." loading="lazy" decoding="async">
<img src="049.webp" width="1000" height="1375" alt="Sorting Hat: This day is a great fork in your destiny. There is no road-sign set to mark the place of your last chance to turn back. If you refuse one chance, will you not refuse others? It may be that your fate is already sealed, even by doing this one thing. / Harry: But that is not certain. / Sorting Hat: That you do not know it for certain may reflect only your own ignorance." loading="lazy" decoding="async">
<img src="050.webp" width="1000" height="1025" alt="The Hat, eyes closed, sighing; the whole panel fades softly into the dark like a memory. / The Hat sighed a terrible, sad sigh. / Sorting Hat: And so before too long you will become another memory, to be felt and never known, in the next warning that I give…" loading="lazy" decoding="async">
<img src="051.webp" width="1000" height="950" alt="Harry: If that's how it seems to you, why aren't you just putting me where you want me to go? / Sorting Hat: I can only put you where you belong. And only your own decisions can change where you belong." loading="lazy" decoding="async">
<img src="052.webp" width="1000" height="700" alt="Harry: Then this is done. Send me to Ravenclaw, where I belong, with the others of my own kind." loading="lazy" decoding="async">
<img src="053.webp" width="1000" height="1150" alt="Sorting Hat: I don't suppose you would consider Gryffindor? It's the most prestigious House—people expect it of you. And your new friends the Weasley twins are there— / Harry giggled. Or rather, he felt the impulse to. It came out as purely mental laughter. And after a moment, Harry heard the Hat laughing too: a strange, sad, clothy sound." loading="lazy" decoding="async">

<img src="075.webp" width="1000" height="175" alt="" loading="lazy" decoding="async">

<img src="079.webp" width="1000" height="800" alt="Across the Hall, at the Hufflepuff table, Neville Longbottom was smiling shyly at the older students making room for him." loading="lazy" decoding="async">
<img src="080.webp" width="1000" height="575" alt="Harry understands. / Harry: Oh." loading="lazy" decoding="async">
